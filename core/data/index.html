<!doctype html>
<!--
loop-scope: the board's own page, one file, served gzipped from its LittleFS partition at
http://loop-scope.local/ (core/core.ino; `uv run programmer.py` writes it). Two views in one page,
so switching tabs keeps everything: Live, a bench scope, and Events, the communication the board
found. Grouped in order: the theme and shared parts, then Live, then Events, in the styles, the
markup and the scripts alike. The controls are built from a few components (LS.ui) into mount
points of the markup. ?demo (or ?demo=square) runs on made-up data without the board.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>loop-scope</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 12h4l3-8 4 16 3-8h6' fill='none' stroke='%238a6ef1' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* MARK: - Theme and shared parts */
/* Obsidian-style dark: near-black greys in steps, one violet accent, few borders. */
:root {
  color-scheme: dark;
  --bg: #1e1e1e; --bg-2: #262626; --bg-3: #2e2e2e; --bg-4: #363636;   /* page, panels, fields, pressed */
  --screen: #141414; --border: #363636; --border-2: #444;
  --text: #dcddde; --muted: #999; --faint: #6b6b6b;
  --accent: #8a6ef1; --accent-2: #a28df5; --accent-bg: rgba(138, 110, 241, .16);
  --ok: #44cf6e; --warn: #e0ac00; --bad: #fb464c; --pink: #ff6fae;
  --trace: #f5d547; --trace-2: #4fc1ff; --trig: #ff9f43; --cursor: #c792ea;   /* channel 1, reference, trigger, cursors */
  --radius: 6px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); }
body { display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.dim { color: var(--faint); }
.bad { color: var(--bad); }
.warn { color: var(--warn); }
.grow { flex: 1; }
.r { text-align: right; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 5px; border: 2px solid var(--bg-2); }
::selection { background: var(--accent-bg); }

/* MARK: components: button, field, segments, stepper, popover */
button, select, input { font: inherit; color: var(--text); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 5px 11px; border: 0; border-radius: var(--radius);
  background: var(--bg-3); cursor: pointer; white-space: nowrap; transition: background .12s, color .12s;
}
.btn:hover:not(:disabled) { background: var(--bg-4); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--accent-2); }
.btn.on { background: var(--accent-bg); color: var(--accent-2); }
.btn.icon { padding: 5px 9px; }
.led { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.on > .led { background: var(--accent-2); box-shadow: 0 0 8px var(--accent); }
input, select { background: var(--bg-3); border: 1px solid transparent; border-radius: var(--radius); padding: 5px 8px; min-width: 0; }
input:focus, select:focus, .btn:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
input[type=number] { width: 80px; }
input[type=checkbox], input[type=range] { accent-color: var(--accent); }
.seg { display: flex; gap: 2px; padding: 2px; background: var(--bg); border-radius: 7px; }
.seg > button { flex: 1; border: 0; border-radius: 5px; background: none; color: var(--muted); padding: 4px 9px; cursor: pointer; white-space: nowrap; }
.seg > button:hover:not(:disabled) { background: var(--bg-3); color: var(--text); }
.seg > button.on { background: var(--accent-bg); color: var(--accent-2); }
.seg > button:disabled { opacity: .45; cursor: default; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto 30px; align-items: center; height: 34px; background: var(--bg-3); border-radius: 8px; }
.step > button { height: 100%; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 10px; cursor: pointer; }
.step > button:hover { background: var(--bg-4); color: var(--text); }
.step output { grid-column: 2 / 4; text-align: center; font: 700 15px var(--mono); }
.step input { width: 100%; padding: 0 4px; border: 0; background: none; text-align: right; font: 600 14px var(--mono); box-shadow: none; appearance: textfield; }
.step input::-webkit-inner-spin-button { display: none; }
.step .unit { padding-right: 4px; color: var(--muted); font: 12px var(--mono); }
.step:focus-within { box-shadow: 0 0 0 2px var(--accent-bg); }
.field { display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: center; gap: 8px; margin-top: 8px; }
.field > span:first-child { color: var(--muted); font-size: 12.5px; }
.chip { display: inline-flex; gap: 4px; align-items: center; padding: 2px 9px; border-radius: 99px; background: var(--bg-4); font: 12px var(--mono); }
.kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--border-2); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); }
.section-title { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.pop { position: absolute; z-index: 30; background: var(--bg-2); border: 1px solid var(--border-2); border-radius: 10px; box-shadow: 0 12px 36px rgba(0, 0, 0, .55); }
.menu { display: grid; min-width: 190px; padding: 4px; }
.menu button { display: flex; justify-content: space-between; gap: 18px; padding: 7px 10px; border: 0; border-radius: 6px; background: none; text-align: left; cursor: pointer; }
.menu button:hover { background: var(--bg-3); }
.menu i { font: normal 12px var(--mono); color: var(--faint); }

/* MARK: header */
.app-header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 14px; background: var(--bg-2); border-bottom: 1px solid var(--border); }
.app-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .02em; }
.app-header svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.app-brand svg { color: var(--accent); }
.app-tabs { display: flex; gap: 2px; padding: 3px; background: var(--bg); border-radius: 9px; }
.app-tab { display: flex; align-items: center; gap: 7px; padding: 6px 16px; border: 0; border-radius: 7px; background: none; color: var(--muted); font-weight: 600; cursor: pointer; }
.app-tab:hover { color: var(--text); background: var(--bg-3); }
.app-tab.on { background: var(--accent); color: #fff; box-shadow: 0 1px 6px rgba(138, 110, 241, .45); }
.app-tab .badge { min-width: 20px; padding: 0 6px; border-radius: 99px; background: rgba(255, 255, 255, .22); font: 11px/18px var(--mono); text-align: center; }
.app-pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 99px; background: var(--bg); font: 12px var(--mono); color: var(--muted); }
.app-pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.app-pill.good { color: var(--text); }
.app-pill.good::before { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.app-pill.fair { color: var(--warn); }
.app-pill.bad { color: var(--bad); }
.app-line { font: 12px var(--mono); color: var(--muted); }
.app-demo { font: 600 11px var(--mono); color: var(--warn); border: 1px solid var(--warn); padding: 2px 7px; border-radius: 4px; }
.app-board { display: flex; gap: 4px; padding: 2px; border-radius: 9px; background: var(--bg); }
.app-board input { width: 190px; border: 0; background: none; font: 12px var(--mono); }
.app-board .btn { padding: 4px 10px; font-size: 12.5px; }
.app-board a { color: var(--text); text-decoration: none; }
.app-by { display: inline-flex; align-items: center; gap: 8px; padding: 3px 11px 3px 3px; border: 0; border-radius: 99px; background: var(--bg); color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.app-by:hover { color: var(--text); background: var(--bg-3); }
.app-heart { color: var(--pink); font-size: 15px; text-decoration: none; }
.app-heart:hover:not(:disabled) { background: rgba(255, 111, 174, .14); }
.avatar { display: grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--pink)); color: #fff; font: 700 10px var(--font); letter-spacing: .03em; }
.avatar.lg { width: 40px; height: 40px; font-size: 14px; }
main { min-height: 0; position: relative; }
.view { display: none; height: 100%; min-height: 0; }
.view.on { display: grid; }
@media (max-width: 760px) { .app-line, .app-by span { display: none; } .app-tab { padding: 6px 11px; } }

/* MARK: dialogs, help, toast */
dialog { max-width: 720px; max-height: 90vh; padding: 20px 24px; border: 1px solid var(--border-2); border-radius: 12px; background: var(--bg-2); color: var(--text); box-shadow: 0 24px 70px rgba(0, 0, 0, .6); }
dialog::backdrop { background: rgba(0, 0, 0, .55); backdrop-filter: blur(2px); }
dialog h2 { margin: 0 0 12px; font-size: 17px; }
dialog p { margin: 6px 0 12px; font-size: 13px; }
.row-end { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
.help-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px 32px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 13px; align-items: center; }
.keys dt { white-space: nowrap; color: var(--muted); }
.keys dd { margin: 0; }
.cal-grid { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 8px 10px; align-items: center; }
.cal-grid input { width: 100%; }
.cal-quick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
#cal-out { min-height: 1.4em; color: var(--accent-2); font-size: 12px; }
.about { width: min(440px, calc(100vw - 32px)); padding: 0; }
.about form { position: relative; display: grid; gap: 14px; padding: 24px; }
.about-x { position: absolute; top: 12px; right: 12px; }
.about-hero { padding: 6px 0 2px; text-align: center; }
.about-logo { display: inline-grid; place-items: center; width: 52px; height: 52px; margin-bottom: 10px; border-radius: 14px; background: var(--accent-bg); color: var(--accent-2); }
.about svg { width: 16px; height: 16px; fill: currentColor; }
.about-logo svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.about-hero h2 { margin: 0 0 4px; font-size: 20px; }
.about-hero p { max-width: 330px; margin: 0 auto; }
.about-author { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: var(--bg-3); }
.about-author .btn { background: var(--bg-4); }
.about small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.about-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.about a { color: var(--text); text-decoration: none; }
.about-sponsor { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid rgba(255, 111, 174, .35); border-radius: 10px; background: linear-gradient(135deg, rgba(255, 111, 174, .14), rgba(138, 110, 241, .1)); transition: border-color .15s, transform .15s; }
.about-sponsor:hover { border-color: var(--pink); transform: translateY(-1px); }
.about-heart { display: grid; place-items: center; flex: none; width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 111, 174, .18); color: var(--pink); font-size: 20px; }
.about-cta { margin-left: auto; padding: 6px 14px; border-radius: 99px; background: var(--pink); color: #fff; font-size: 13px; font-weight: 600; }
#app-toast { position: fixed; left: 50%; bottom: 24px; z-index: 50; padding: 8px 16px; border-radius: 8px; background: var(--bg-4); opacity: 0; pointer-events: none; transform: translate(-50%, 20px); transition: .2s; }
#app-toast.on { opacity: 1; transform: translate(-50%, 0); }

/* MARK: - Live */
/* A bench scope: the screen with its tags, the measurements under it, the front panel on the right
   (the everyday controls) and its More drawer (the rest). */
#live { grid-template-columns: minmax(0, 1fr) 280px; }

/* MARK: the screen and the measurement strip */
.lv-main { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; padding: 12px; min-width: 0; min-height: 0; }
.lv-wrap { position: relative; min-height: 240px; overflow: hidden; background: var(--screen); border: 1px solid var(--border); border-radius: 10px; box-shadow: inset 0 0 40px rgba(0, 0, 0, .55); }
#lv-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.lv-tag { position: absolute; z-index: 1; display: flex; align-items: center; gap: 8px; pointer-events: none; font: 12px/1 var(--mono); white-space: nowrap; }
.lv-tl { top: 28px; left: 36px; }
.lv-tr { top: 28px; right: 36px; }
.lv-bl { bottom: 10px; left: 36px; }
.lv-br { bottom: 10px; right: 36px; }
.lv-pill, .lv-badge, .lv-archip, .lv-curs, .lv-hover { padding: 5px 10px; border-radius: 6px; background: rgba(20, 20, 20, .85); backdrop-filter: blur(3px); }
.lv-pill { display: inline-flex; align-items: center; gap: 8px; }
.lv-pill b { font-size: 13px; }
.lv-pill span { color: var(--muted); }
.lv-pill.trace b { color: var(--trace); }
.lv-pill.trig :is(b, i) { color: var(--trig); font-style: normal; }
.lv-ch { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 4px; background: var(--trace); color: #111; font: 700 11px var(--mono); }
.lv-flag { padding: 1px 5px; border-radius: 3px; background: var(--bg-4); font-size: 11px; }
.lv-flag.ref { background: rgba(79, 193, 255, .18); color: var(--trace-2); }
.lv-badge { font-weight: 700; letter-spacing: .06em; color: var(--c); background: color-mix(in srgb, var(--c) 18%, #141414); }
.lv-badge.trig { --c: var(--ok); }
.lv-badge.auto { --c: var(--accent-2); }
.lv-badge.wait { --c: var(--warn); }
.lv-badge.stop { --c: var(--bad); }
.lv-badge.roll { --c: var(--trace-2); }
.lv-badge.off { --c: var(--faint); }
.lv-archip { font-weight: 700; font-size: 11px; color: #fff; background: var(--accent); transition: box-shadow .3s; }
.lv-archip.flash { box-shadow: 0 0 0 3px rgba(162, 141, 245, .45), 0 0 18px var(--accent); }
.lv-curs { position: absolute; top: 62px; left: 36px; z-index: 1; display: grid; grid-template-columns: auto auto; gap: 0 12px; pointer-events: none; font: 12px/1.55 var(--mono); }
.lv-curs b { color: var(--cursor); }
.lv-hover { position: absolute; z-index: 2; pointer-events: none; white-space: nowrap; font: 12px var(--mono); }
.lv-meas { position: relative; display: flex; align-items: flex-start; gap: 6px; }
.lv-mlist { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px 18px; min-width: 0; padding: 2px 6px; }
.lv-m { display: grid; min-width: 0; }
.lv-mn { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.lv-mv { font: 600 16px/1.3 var(--mono); color: var(--trace); }
.lv-ms { font: 10.5px/1.35 var(--mono); color: var(--muted); }
.lv-m > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv-mlist:not(.stats) .lv-ms { display: none; }
.lv-pick { right: 0; bottom: calc(100% + 8px); display: grid; grid-template-columns: repeat(3, auto); gap: 6px 16px; padding: 12px 14px; }
.lv-pick label { display: flex; gap: 7px; align-items: center; white-space: nowrap; cursor: pointer; }
.lv-pick h4, .lv-pick .row-end { grid-column: 1 / -1; margin: 0; }
.lv-meas > .btn { margin-top: 4px; }

/* MARK: the front panel and its More drawer */
.lv-panel { position: relative; display: flex; flex-direction: column; gap: 18px; min-height: 0; overflow-y: auto; padding: 16px; background: var(--bg-2); }
.lv-two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.lv-two > .btn { padding: 9px; font-weight: 600; letter-spacing: .02em; }
.lv-run.run { color: var(--ok); background: rgba(68, 207, 110, .12); }
.lv-run.run > .led { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.lv-run.stop { color: var(--bad); background: rgba(251, 70, 76, .13); }
.lv-run.stop > .led { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
#lv-single.armed { color: var(--trig); background: rgba(255, 159, 67, .15); }
.lv-wide { width: 100%; margin-top: 8px; }
.lv-row { display: flex; gap: 6px; }
.lv-row > * { flex: 1; }
.lv-row > .icon { flex: none; }
.lv-note { margin: 6px 0 0; font-size: 12px; color: var(--faint); }
#live .seg > button { padding: 5px 4px; font-size: 12.5px; }
.lv-foot { display: flex; gap: 6px; margin-top: auto; }
.lv-foot > :first-child { flex: 1; }
.lv-more { inset: 0; display: flex; flex-direction: column; gap: 16px; padding: 16px; overflow-y: auto; border: 0; border-radius: 0; box-shadow: -14px 0 30px rgba(0, 0, 0, .45); }
.lv-more .row-end { margin: 0; }
.lv-more h2 { margin: 0; font-size: 15px; }
.lv-range { display: grid; grid-template-columns: minmax(0, 1fr) 40px auto; gap: 6px; align-items: center; font-size: 12px; }
.lv-range input { width: 100%; padding: 0; background: none; }
.lv-c-trace { color: var(--trace); }
.lv-c-trig { color: var(--trig); }
@media (max-width: 800px) {
  #live { grid-template-columns: minmax(0, 1fr); grid-template-rows: max-content max-content; overflow-y: auto; }
  .lv-main { padding: 8px; }
  .lv-wrap { height: min(66vh, 78vw); min-height: 220px; }
  .lv-panel { overflow: visible; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .lv-tl, .lv-bl { left: 30px; }
  .lv-tr, .lv-br { right: 30px; }
  .lv-tag { gap: 4px; font-size: 11px; }
  .lv-pill span { display: none; }
  .lv-pick { grid-template-columns: repeat(2, auto); }
}

/* MARK: - Events */
/* The capture bar, the list (or groups) on the left; the selected event's info, overview, plot and
   tabs (pulses, histogram, decode, compare) on the right. Quiet: ghost buttons, flat fields. */
#events.on { grid-template-columns: var(--ev-left, 480px) 6px minmax(0, 1fr); overflow: hidden; }
#events .btn { background: none; color: var(--muted); }
#events .btn:hover:not(:disabled) { background: var(--bg-3); color: var(--text); }
#events .btn.on { background: var(--accent-bg); color: var(--accent-2); }
#events .ev-link { color: var(--accent-2); font-weight: 600; }
#events .btn.danger { margin-left: 8px; color: var(--bad); background: rgba(251, 70, 76, .08); }
#events .btn.danger:hover { background: var(--bad); color: #fff; }
.ev-cnt { font: 11px var(--mono); opacity: .8; }
.ev-sep { margin: 0 7px; color: var(--border-2); }

/* MARK: left column */
.ev-side { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg-2); }
.ev-side > * { flex: none; }
.ev-side > .ev-listwrap { flex: 1 1 0; }
.ev-split, .ev-hsplit { position: relative; z-index: 2; background: var(--bg-2); touch-action: none; }
.ev-split { cursor: col-resize; border-left: 1px solid var(--border); }
.ev-hsplit { cursor: row-resize; border-top: 1px solid var(--border); }
:is(.ev-split, .ev-hsplit):is(:hover, .drag) { background: var(--accent-bg); border-color: var(--accent); }
.ev-cap { position: relative; display: grid; gap: 9px; padding: 12px 14px 6px; }
.ev-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.ev-arm { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px 5px 11px; border: 0; border-radius: 99px; background: rgba(68, 207, 110, .1); color: var(--ok); font-weight: 700; cursor: pointer; }
.ev-arm > .led { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: ev-blink 1.6s ease-in-out infinite; }
.ev-arm.paused { background: rgba(224, 172, 0, .1); color: var(--warn); }
.ev-arm.paused > .led { background: var(--warn); box-shadow: none; animation: none; border-radius: 2px; }
@keyframes ev-blink { 50% { opacity: .3; } }
.ev-fld { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.ev-fld i { font-style: normal; color: var(--faint); }
.ev-fld input { width: 66px; padding: 3px 6px; font: 12.5px var(--mono); text-align: right; }
.ev-set { top: 50px; right: 10px; display: grid; gap: 8px; width: 300px; padding: 12px 14px; }
.ev-set .ev-fld { display: grid; grid-template-columns: 1fr 76px 30px; }
.ev-set p { margin: 4px 0 0; font-size: 12px; }
.ev-stats { font: 11.5px/1.6 var(--mono); color: var(--faint); }
.ev-stats b { color: var(--muted); font-weight: 500; }
.ev-tools { display: flex; gap: 6px; align-items: center; padding: 4px 10px 8px; }
#ev-search { flex: 1; min-width: 60px; padding: 4px 9px; font-size: 12.5px; }
.ev-filter { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--accent-bg); font-size: 12.5px; }

/* MARK: the list and the groups */
.ev-listwrap { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: var(--bg); }
.ev-cols { display: grid; grid-template-columns: 16px 46px 88px 54px 58px 38px 42px minmax(40px, 1fr); gap: 0 8px; align-items: center; padding: 0 10px; }
.ev-gcols { display: grid; grid-template-columns: 50px minmax(70px, 1fr) 44px 40px 58px 42px 64px 20px; gap: 0 8px; align-items: center; padding: 0 10px; }
.ev-head { height: 28px; background: var(--bg-2); border-bottom: 1px solid var(--border); font: 600 10.5px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); user-select: none; }
.ev-head span { white-space: nowrap; overflow: hidden; }
#ev-head span { cursor: pointer; }
#ev-head span:hover { color: var(--text); }
#ev-head span.on { color: var(--accent-2); }
.ev-list { position: relative; overflow: hidden auto; outline: none; }
#ev-rows { position: absolute; inset: 0 0 auto; }
.ev-row, .ev-grow { font: 12px var(--mono); border-bottom: 1px solid rgba(255, 255, 255, .035); cursor: pointer; user-select: none; }
.ev-row { height: 26px; }
.ev-grow { min-height: 34px; }
:is(.ev-row, .ev-grow) > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ev-row.imp .ev-no { color: var(--trace-2); }

.ev-st { color: var(--faint); opacity: .3; text-align: center; font-size: 13px; }

.ev-spark { flex: 0 1 auto; height: 14px; min-width: 0; max-width: 100%; overflow: visible; }

.ev-note { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--accent-2); font: italic 12px var(--font); }

/* MARK: right: the selected event */

.ev-info > div + div { gap: 2px; margin-left: -8px; }
.ev-title { display: flex; align-items: center; gap: 9px; font: 700 15px var(--mono); white-space: nowrap; }
.ev-badge { padding: 1px 6px; border: 1px solid var(--border-2); border-radius: 4px; color: var(--muted); font: 600 10.5px var(--font); letter-spacing: .05em; text-transform: uppercase; }

.ev-kvs { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.ev-kv { display: inline-flex; flex-direction: column; line-height: 1.2; }
.ev-kv i { font: normal 10px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.ev-kv b { font: 600 12.5px var(--mono); white-space: nowrap; }
.ev-info .btn, .ev-ph .btn, .ev-foot .btn { padding: 3px 9px; font-size: 12.5px; }
#events .ev-cur { font: 600 12.5px var(--mono); }
#events .ev-cur.set { color: var(--cursor); }
#events .ev-cur.on { background: var(--cursor); color: #000; }
#events #ev-star.on { color: var(--warn); background: none; }

#ev-note { flex: 1 1 180px; min-width: 120px; margin-left: 6px; padding: 4px 8px; background: none; font-size: 12.5px; }

.ev-ov, .ev-plotwrap, .ev-cv { position: relative; min-width: 0; min-height: 0; background: var(--screen); }

.ev-tag { position: absolute; z-index: 2; padding: 4px 9px; border-radius: 6px; background: rgba(20, 20, 20, .9); font: 12px var(--mono); }

.ev-empty-plot { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); line-height: 1.8; pointer-events: none; }

/* MARK: bottom panel */

.ev-scroll { min-height: 0; overflow: auto; background: var(--bg); }

.ev-chips .u { background: var(--accent-bg); color: var(--accent-2); }
.ev-hint, .ev-dsum { padding: 12px 14px; color: var(--faint); line-height: 1.6; }
:is(.ev-hint, .ev-dsum, .ev-bits, .ev-dout):empty { display: none; }
.ev-dout { display: inline-block; max-width: 260px; margin-left: 6px; overflow: hidden; vertical-align: bottom; color: var(--trace); font: 400 12px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
.ev-tbl { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
.ev-tbl th { position: sticky; top: 0; z-index: 1; padding: 6px 12px; background: var(--bg-2); border-bottom: 1px solid var(--border); color: var(--faint); font: 600 10.5px var(--font); letter-spacing: .05em; text-align: right; }

.ev-tbl tbody tr { cursor: pointer; }
.ev-tbl tbody tr:hover { background: var(--bg-3); }
.ev-tbl tr.on { background: var(--accent-bg); }
.ev-tbl tr.diff td { background: rgba(251, 70, 76, .08); }
.ev-tbl tr.diff .dd, .ev-hexcmp .bad { color: var(--bad); font-weight: 700; }
.H { color: var(--ok); }
.L { color: var(--muted); }
.b1 { color: var(--trace); }
.b0 { color: var(--trace-2); }
.ev-bits { padding: 10px 12px; font: 13px/1.9 var(--mono); word-break: break-all; }
.ev-bits .by { display: inline-block; margin-right: 8px; padding: 0 4px; border-radius: 4px; background: var(--bg-3); }
.ev-bits b { padding: 0 1px; border-radius: 2px; font-weight: 400; cursor: pointer; }

/* MARK: narrow: stacked */
@media (max-width: 800px) {
  #events.on { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; overflow-y: auto; }
  .ev-split { display: none; }
  .ev-hsplit { visibility: hidden; border: 0; }
  .ev-side > .ev-listwrap { flex: none; height: 44vh; }
  .ev-main { grid-template-rows: auto 46px 340px 0 380px; }
  .ev-dout { max-width: 120px; }
  .ev-cols { grid-template-columns: 16px 44px 54px 56px 38px minmax(60px, 1fr); }
  .ev-c-time, .ev-c-sw, .ev-gcols > :nth-child(6), .ev-gcols > :nth-child(7) { display: none; }
  .ev-gcols { grid-template-columns: 46px minmax(70px, 1fr) 40px 36px 54px 20px; }
  .ev-hover { max-width: calc(100% - 84px); }
  .ev-curs { top: auto; bottom: 30px; }
}
</style>

<body>
<header id="app-header" class="app-header"></header>
<main>
<!-- MARK: - Live -->
<section id="live" class="view">
  <div class="lv-main">
    <div class="lv-wrap" id="lv-wrap">
      <canvas id="lv-canvas" aria-label="Oscilloscope screen"></canvas>
      <div class="lv-tag lv-tl"><span id="lv-badge" class="lv-badge off">OFFLINE</span><span id="lv-archip" class="lv-archip" hidden>AUTO-RANGE</span></div>
      <div class="lv-tag lv-tr" id="lv-tagh"></div>
      <div class="lv-tag lv-bl" id="lv-tagv"></div>
      <div class="lv-tag lv-br" id="lv-tagt"></div>
      <div class="lv-curs" id="lv-curs" hidden></div>
      <div class="lv-hover" id="lv-hover" hidden></div>
    </div>
    <div class="lv-meas"><div class="lv-mlist" id="lv-mlist"></div><button class="btn icon" data-pop="lv-pick" title="Choose the measurements, statistics (M)">＋</button><div class="pop lv-pick" id="lv-pick" hidden></div></div>
  </div>
  <aside class="lv-panel" id="lv-panel"></aside>
</section>
<!-- MARK: - Events -->
<section id="events" class="view">
  <aside id="ev-side" class="ev-side">
    <section class="ev-cap"><div class="ev-bar" id="ev-capbar"></div><p id="ev-flood" class="ev-flood" hidden>Mostly noise: set Detect above the line's noise (<button class="btn ev-link" data-act="auto">Auto</button>)</p><div id="ev-set" class="pop ev-set" hidden></div><div id="ev-stats" class="ev-stats"></div></section>
    <div class="ev-tools" id="ev-tools"></div>
    <div id="ev-filter" class="ev-filter" hidden></div>
    <div id="ev-listwrap" class="ev-listwrap">
      <div id="ev-head" class="ev-cols ev-head"></div>
      <div id="ev-list" class="ev-list" tabindex="0"><div id="ev-spacer"></div><div id="ev-rows"></div><div id="ev-empty" class="ev-empty"></div></div>
    </div>
    <div id="ev-groups" class="ev-listwrap" hidden><div class="ev-gcols ev-head" id="ev-ghead"></div><div id="ev-gbody" class="ev-gbody"></div></div>
    <div class="ev-foot" id="ev-foot"></div>
    <div id="ev-drop" class="ev-drop" hidden>Drop .jsonl files to import</div>
    <input id="ev-file" type="file" accept=".jsonl,.ndjson,.json,.txt" multiple hidden>
  </aside>
  <div id="ev-split" class="ev-split" title="Drag to resize"></div>
  <div id="ev-main" class="ev-main">
    <div class="ev-info"><div><div id="ev-i-title" class="ev-title"></div><div id="ev-i-kv" class="ev-kvs"></div></div><div id="ev-ibar"></div></div>
    <div class="ev-ov" title="The whole capture: drag the window, or its edges"><canvas id="ev-ov"></canvas></div>
    <div class="ev-plotwrap">
      <canvas id="ev-plot"></canvas>
      <div id="ev-hover" class="ev-tag ev-hover" hidden></div>
      <div id="ev-curs" class="ev-tag ev-curs" hidden></div>
      <div id="ev-empty-plot" class="ev-empty-plot"><div><b>No event selected</b><br>Events appear when the line moves more than <b>Detect</b>.<br><span class="dim">Wheel: zoom · drag: pan · double-click: fit · <span class="kbd">?</span> shortcuts</span></div></div>
    </div>
    <div id="ev-hsplit" class="ev-hsplit" title="Drag to resize"></div>
    <div class="ev-panel">
      <nav id="ev-tabs"></nav>
      <div class="ev-pane" data-p="pulses"><div class="ev-ph" id="ev-ph-pulses"></div><div class="ev-scroll" id="ev-sc-pulses"></div></div>
      <div class="ev-pane" data-p="hist"><div class="ev-ph" id="ev-ph-hist"></div><div class="ev-cv"><canvas id="ev-hist"></canvas></div></div>
      <div class="ev-pane" data-p="decode"><div class="ev-ph" id="ev-ph-decode"></div><div class="ev-scroll" id="ev-sc-decode"></div></div>
      <div class="ev-pane" data-p="compare"><div class="ev-ph" id="ev-ph-compare"></div><div class="ev-scroll" id="ev-cbody"></div></div>
    </div>
  </div>
</section>
</main>
<script>
// MARK: - Shared: the stream, calibration, components, header
// What the Live and Events views share, as window.LS: one stream from the board, parsed once; the
// calibration from raw codes to volts (the board only ever sends codes); the edge reading and the
// plotting both views use; the components their controls are built from; the header with its tabs,
// link quality and Calibrate dialog; settings kept in the browser; a demo source.
//
// The board's frames (core/src/LoopCapture.h): "LS", u8 type, u8 flags, u32 n, u64 index, payload.
//   S status, each second: u32 rate, u8 lo, u8 hi, u8 base, u8 thr, u32 events, u32 lost
//   L live: (lo, hi) code pairs, each the min and max of flags (64) samples
//   W scope window: u32 trigger offset (~0: ran free), u32 window samples, then raw codes
//     (flags 1) or (lo, hi) pairs of flags samples each
//   E event piece: raw codes; flags 1 first piece, 2 last, 4 samples lost just before
// The board takes GET /set?thr=<codes>, pre=<samples>, post=<samples>,
// scope=<window>+<pre>+<level code>+<edge 1 rise / 2 fall>+<mode 0 off / 1 auto / 2 normal / 3 single>.
//
// A view registers with LS.view(name, {init(root), show(), hide(), key(e)}); key gets the keys
// while its tab is shown and no dialog is open.
"use strict";
(function () {
  const LINE = [142, 3098];  // without the board's table (demo, older firmware): its eFuse ADC line at 12 dB, mV at raw 0 and 4095
  const DEFCAL = { points: [[0, 0], [3.3, 15]], unit: "V" }, THR = 0.42;   // the default probe calibration and Detect (V)
  const LIVE = 64;           // samples per live pair
  const LR = 160000;         // live pairs kept: 10 s
  const NONE = 0xffffffff;
  const handlers = {}, views = {};
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const bad = x => x == null || !isFinite(x);

  const Q = new URLSearchParams(location.search), AWAY = location.protocol !== "http:" || Q.has("board");   // AWAY: not served by the board
  const stored = () => { try { return localStorage.getItem("loop-scope:board"); } catch {} };
  let PIN;                   // pin mV of each code (LS.pinTable)
  const LS = window.LS = {
    CAL: LINE, LIVE, THR, clamp,   // CAL: the pin calibration in use, as /info gives it (or LINE)
    rate: 1e6,               // samples a second, from the status
    online: false,
    status: null,            // the newest status: {index, rate, lo, hi, base, thr, events, lost}
    tab: null,
    demo: Q.get("demo"),     // null, "" (bursts), "square" or "noise"
    // the board's host: "" when the board serves this page; else ?board=, the last one typed, or loop-scope.local
    away: AWAY,
    board: AWAY ? Q.get("board") || stored() || "loop-scope.local" : "",
    // a request to the board; targetAddressSpace lets Chrome reach it from an https page (after its prompt)
    get: (path, o = {}) => fetch(LS.board ? "http://" + LS.board + path : path, LS.board ? { ...o, targetAddressSpace: "local" } : o),
    received: 0,             // whole events the stream brought
    broken: 0,               // events dropped for a hole inside
    C: {},                   // the theme's colors for the canvases (C.trace2 for --trace-2), C.mono

    // MARK: events between the parts
    // "status" (status), "live" (pairs added), "wave" ({index, trig|null, win, per, lo, hi, n}),
    // "event" ({no, index, t: Date, s: Uint8Array}), "online" (bool), "calibration"
    on(type, fn) { (handlers[type] ??= []).push(fn); },
    emit(type, x) { for (const f of handlers[type] || []) { try { f(x); } catch (e) { console.error(e); } } },

    // MARK: settings kept in the browser
    load(key, defaults) {
      try { return Object.assign({}, defaults, JSON.parse(localStorage.getItem("loop-scope:" + key))); } catch { return Object.assign({}, defaults); }
    },
    save(key, obj) { try { localStorage.setItem("loop-scope:" + key, JSON.stringify(obj)); } catch {} },

    // MARK: the board
    // One /set in flight, the newest of each kind waiting: a burst of scope changes (Autoset, a drag)
    // otherwise opened a TCP connection each and timed out on the board's one request task (measured).
    set: (() => {
      const want = new Map();
      let busy = false;
      const pump = async () => {
        for (busy = true; want.size;) {
          const [k, q] = want.entries().next().value;
          want.delete(k);
          if (!await LS.get("/set?" + q).then(r => r.ok, () => false) && LS.online && !want.has(k)) {   // failed: again, unless newer is waiting
            want.set(k, q);
            await new Promise(r => setTimeout(r, 500));
          }
        }
        busy = false;
      };
      return query => {
        if (LS.demo !== null) return demo.command(query);
        want.set(query.split("=")[0], query);
        if (!busy) pump();
      };
    })(),
    setThr: (volts = LS.load("capture", { thr: THR }).thr) => LS.set("thr=" + clamp(Math.round(Math.abs(volts / LS.perCode())), 1, 255)),
    scope: (...a) => LS.set("scope=" + a.map(Math.round).join("+")),   // window, pre, level code, edge, mode

    // MARK: calibration: code -> pin volts (the board's table, else its eFuse line) -> loop volts (two points)
    cal: null,               // {points: [[pinV, loopV], [pinV, loopV]], unit}
    VT: new Float32Array(256),  // loop volts of each code
    // pin mV of each code from a calibration: the board's 256 values, or a line [mV at raw 0, at 4095] (code c: raw c*16+8)
    pinTable: cal => cal?.length === 256 ? Float32Array.from(cal) : Float32Array.from({ length: 256 }, (_, c) => cal[0] + (c * 16 + 8) * (cal[1] - cal[0]) / 4095),
    pinVolts: c => { const T = PIN, i = clamp(Math.floor(c), 0, 254); return (T[i] + (T[i + 1] - T[i]) * (c - i)) / 1000; },   // fractional codes too
    gain() { const [[r0, a0], [r1, a1]] = LS.cal.points; return r1 !== r0 ? (a1 - a0) / (r1 - r0) : 1; },
    offset() { const [[r0, a0]] = LS.cal.points; return a0 - LS.gain() * r0; },
    voltsF: c => LS.gain() * LS.pinVolts(c) + LS.offset(),       // fractional codes too
    perCode: () => (LS.VT[255] - LS.VT[0]) / 255,                  // loop volts a code, on average (negative: inverted)
    code: v => { let b = 0; for (let c = 1; c < 256; c++) if (Math.abs(LS.VT[c] - v) < Math.abs(LS.VT[b] - v)) b = c; return b; },
    setCalibration(cal = LS.cal) {
      LS.cal = cal; LS.save("calibration", cal);
      for (let c = 0; c < 256; c++) LS.VT[c] = LS.voltsF(c);
      LS.emit("calibration", cal);
    },

    // MARK: the live envelope: a ring of (lo, hi) pairs, gaps as lo 255 > hi 0
    live: {
      lo: new Uint8Array(LR), hi: new Uint8Array(LR), size: LR, n: 0, end: null,   // end: sample index past the newest
      // the newest k pairs at most, copied into lo and hi (new arrays when not given): {lo, hi, n}
      last(k, lo = new Uint8Array(k), hi = new Uint8Array(k)) {
        const n = Math.min(k, this.n, LR), a = (this.n - n) % LR, m = Math.min(n, LR - a);
        lo.set(this.lo.subarray(a, a + m)); lo.set(this.lo.subarray(0, n - m), m);
        hi.set(this.hi.subarray(a, a + m)); hi.set(this.hi.subarray(0, n - m), m);
        return { lo, hi, n };
      },
      put(lo, hi) { const j = this.n++ % LR; this.lo[j] = lo; this.hi[j] = hi; },
    },

    // MARK: shared reading of a capture
    // Edges of v[i0, i1) by hysteresis ±h around mid (NaN: skipped), each placed by interpolation at
    // mid between the two points of its crossing. first: the level before the first edge (1 high).
    edges(v, mid, h, i0 = 0, i1 = v.length) {
      const e = [];
      let s = -1, first = -1;
      for (let i = i0; i < i1; i++) {
        const x = v[i];
        if (s < 0) { s = first = x >= mid + h ? 1 : x <= mid - h ? 0 : -1; continue; }
        if (s ? x <= mid - h : x >= mid + h) {
          let j = i;
          while (j > i0 + 1 && (s ? v[j - 1] <= mid : v[j - 1] >= mid)) j--;   // back to the crossing
          const a = v[j - 1], b = v[j];
          e.push(j - 1 + (a === b || a !== a ? 1 : (mid - a) / (b - a)));
          s ^= 1;
        }
      }
      return { e, first: first < 0 ? +(v[i0] > mid) : first };
    },
    // An event's codes: their span, and the edges around its middle (a swing under 8 codes is noise).
    decode(s) {
      let lo = 255, hi = 0;
      for (let i = 0; i < s.length; i++) { const c = s[i]; if (c < lo) lo = c; if (c > hi) hi = c; }   // indexed: for-of is 2x slower here (measured)
      const mid = (lo + hi) / 2, E = hi - lo < 8 ? { e: [], first: +(s[0] > mid) } : LS.edges(s, mid, Math.max((hi - lo) * 0.1, 3));
      return { lo, hi, mid, edges: E.e, first: E.first };
    },
    // Widths that recur: sorted, grouped within 15% (+1), the biggest groups first.
    clusters(widths, top = 6) {
      const g = [];
      for (const w of [...widths].sort((a, b) => a - b)) {
        const l = g[g.length - 1];
        if (l && w <= l.min * 1.15 + 1) l.sum += w, l.n++; else g.push({ min: w, sum: w, n: 1 });
      }
      return g.sort((a, b) => b.n - a.n).slice(0, top).map(c => ({ w: c.sum / c.n, n: c.n }));
    },
    fmt: {
      t: s => { const a = Math.abs(s); return bad(s) ? "—" : a >= 1 ? +s.toPrecision(3) + " s" : a >= 1e-3 ? +(s * 1e3).toPrecision(3) + " ms" : a >= 1e-6 || a === 0 ? +(s * 1e6).toPrecision(3) + " µs" : +(s * 1e9).toPrecision(3) + " ns"; },
      v: v => bad(v) ? "—" : Math.abs(v) < 1 && v !== 0 ? +(v * 1e3).toPrecision(3) + " mV" : v.toFixed(Math.abs(v) >= 100 ? 1 : 2) + " " + LS.unit(),
      f: f => bad(f) ? "—" : f >= 1e6 ? +(f / 1e6).toPrecision(3) + " MHz" : f >= 1e3 ? +(f / 1e3).toPrecision(3) + " kHz" : +f.toPrecision(3) + " Hz",
      clock: t => t.toLocaleTimeString([], { hour12: false }) + "." + String(t.getMilliseconds()).padStart(3, "0"),
    },
    unit: () => LS.cal?.unit || "V",
    nice(x) { const p = 10 ** Math.floor(Math.log10(x)), m = x / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; },
    download(name, data, type = "application/octet-stream") {
      const a = document.createElement("a");
      a.href = data instanceof Blob ? URL.createObjectURL(data) : data.startsWith("data:") ? data : URL.createObjectURL(new Blob([data], { type }));

    stamp: () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 19).replace(/[-:]/g, "").replace("T", "-"),
    setBadge(view, text) { const b = document.querySelector(`[data-tab="${view}"] .badge`); b.textContent = text; b.hidden = !text; },
    toast(text) {
      const t = document.getElementById("app-toast") || document.body.appendChild(Object.assign(document.createElement("div"), { id: "app-toast" }));
      t.textContent = text; t.classList.add("on"); clearTimeout(t.timer); t.timer = setTimeout(() => t.classList.remove("on"), 2600);
    },

    // MARK: drawing
    // A canvas at the screen's pixel density, drawn in CSS px: {g, W, H, d}.
    canvas(c) {
      const d = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight, w = Math.round(W * d), h = Math.round(H * d);
      if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
      const g = c.getContext("2d");
      g.setTransform(d, 0, 0, d, 0, 0);
      return { g, W, H, d };
    },
    // S's points i at x0 + i·dx (CSS px), each from lo[i] to hi[i] through the table S.T if any (lo >
    // hi or NaN: a gap), at heights Y(volts). Sparse: a line through the middles with each point's span

    // an edge stays one stroke.
    plot(g, d, S, x0, dx, Y, color, lw = 1.6, dots = false) {
      const { lo, hi, T } = S, i0 = Math.max(0, Math.floor(-x0 / dx) - 1), i1 = Math.min(S.n, Math.ceil((g.canvas.width / d - x0) / dx) + 2);
      g.fillStyle = g.strokeStyle = color; g.lineWidth = lw; g.lineJoin = "round"; g.beginPath();
      if (dx * d >= 2) {
        const s = Math.max(2.5, lw * 1.6);
        let pen = false;
        for (let i = i0; i < i1; i++) {
          const a = lo[i], b = hi[i];
          if (!(a <= b)) { pen = false; continue; }
          const x = x0 + i * dx, ya = Y(T ? T[a] : a), yb = Y(T ? T[b] : b), ym = (ya + yb) / 2;
          if (dots) { g.rect(x - s / 2, Math.min(ya, yb) - s / 2, s, Math.abs(ya - yb) + s); continue; }
          pen ? g.lineTo(x, ym) : g.moveTo(x, ym); pen = true;
          if (ya !== yb) { g.moveTo(x, ya); g.lineTo(x, yb); g.moveTo(x, ym); }
        }
        dots ? g.fill() : g.stroke();
        return;
      }
      let col = NaN, mn = Infinity, mx = -Infinity, pt = null, pb = 0;
      const flush = () => {
        if (mn > mx) return;
        const a = Y(mx), b = Y(mn), t = Math.min(a, b), u = Math.max(a, b), join = pt !== null && !dots;   // min, max: an inverting table too
        const yt = join ? Math.min(t, pb) : t, yb = join ? Math.max(u, pt) : u;

      };
      for (let i = i0; i < i1; i++) {
        const c = Math.floor((x0 + i * dx) * d);
        if (c !== col) { flush(); col = c; }
        const a = lo[i], b = hi[i];
        if (!(a <= b)) { pt = null; continue; }
        const va = T ? T[a] : a, vb = T ? T[b] : b;
        if (va < mn) mn = va; if (va > mx) mx = va;
        if (vb < mn) mn = vb; if (vb > mx) mx = vb;
      }
      flush();
    },

    // MARK: views
    view(name, mod) { views[name] = mod; },
    showTab(name) {
      if (!views[name] || LS.tab === name) return;
      const was = LS.tab;
      LS.tab = name;
      for (const v in views) {
        document.getElementById(v).classList.toggle("on", v === name);
        document.querySelector(`[data-tab="${v}"]`).classList.toggle("on", v === name);
      }
      if (was) views[was].hide?.();
      views[name].show?.();
      history.replaceState(null, "", "#" + name);
      document.title = (name === "live" ? "Live" : "Events") + " · loop-scope";
    },
    start() {

      for (const k of ["screen", "trace", "trace-2", "trig", "cursor", "accent", "ok", "text", "muted", "faint", "border", "bg-2", "mono"]) LS.C[k.replace("-", "")] = cs.getPropertyValue("--" + k).trim();

  // MARK: components: the views' controls, as HTML, wired by delegation (ui.wire)
  const at = o => Object.entries(o).map(([k, v]) => v == null || v === false ? "" : v === true ? " " + k : ` ${k}="${v}"`).join("");
  const ui = LS.ui = {
    // a button doing act (the view's act(name)); o: its other attributes, o.cls its classes
    btn: (label, act, { cls, ...o } = {}) => `<button class="btn${cls ? " " + cls : ""}"${at({ "data-act": act, ...o })}>${label}</button>`,
    // buttons opening the popover id (a click elsewhere or Esc closes it)

    // ◀ value ▶ turning knob name: an output, or a number input with a unit

    num: (id, label, unit, o = {}) => `<label class="ev-fld"${at({ title: o.title })}><span>${label}</span><input${at({ id, type: "number", ...o, title: null })}><i>${unit}</i></label>`,
    table: (id, cols) => `<table class="ev-tbl"><thead><tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody id="${id}"></tbody></table>`,
    kbd: (...k) => k.map(x => `<span class="kbd">${x}</span>`).join(" "),
    // a help dialog: cols [[title, [[keys (HTML), what], ...]], ...]

        `<p class="muted">${note}</p><div class="row-end"><span class="grow"></span><button class="btn primary">Close</button></div>`;

    },
    // clicks in root: [data-pop] toggles its popover, [data-act] h.act(name, el, e), [data-seg] buttons
    // h.seg(name, value), [data-knob] buttons h.knob(name, ±1)
    wire(root, h) {
      root.addEventListener("click", e => {
        const t = e.target, p = t.closest("[data-pop]"), a = t.closest("[data-act]"), s = t.closest("[data-seg] > button"), k = t.closest("[data-knob] > button");

    close() {

    },
    segOn: (el, v) => { for (const b of el.children) b.classList.toggle("on", b.dataset.v === String(v)); },
  };

  // MARK: the stream: one endless HTTP response of frames, back to back
  let hist = [], pairsGot = 0, cur = null;
  function connect() {
    (async () => {
      for (;;) {
        try {
          const r = await LS.get("/stream?scope", { cache: "no-store" });
          if (!r.ok) throw r.status;   // a page host without the board (GitHub Pages): no frames there
          const rd = r.body.getReader();
          online(true);
          // one buffer, reused: the frames handed on are copies
          for (let buf = new Uint8Array(1 << 16), len = 0; ;) {
            const { value, done } = await rd.read();
            if (done) break;
            if (len + value.length > buf.length) { const b = new Uint8Array(Math.max(buf.length * 2, len + value.length)); b.set(buf.subarray(0, len)); buf = b; }
            buf.set(value, len); len += value.length;
            const used = parse(buf.subarray(0, len));
            buf.copyWithin(0, used, len); len -= used;
          }
        } catch {}
        online(false);
        await new Promise(r => setTimeout(r, 1000));
      }
    })();
  }
  function online(on) {
    LS.online = on; hist = []; cur = null;
    if (on) LS.setThr();  // the board forgets on reboot; the page does not
    if (on) (LS.demo !== null ? Promise.resolve(demo.info) : LS.get("/info", { cache: "no-store" }).then(r => r.json())).then(i => {   // {reset, uptime_s, cal_src, cal}
      if (/crash|brownout/.test(i.reset) && i.uptime_s < 120) LS.toast(`The board restarted ${i.uptime_s} s ago after a ${i.reset}`);
      if (i.cal?.length === 256) { LS.CAL = i.cal; PIN = LS.pinTable(i.cal); LS.setCalibration(); LS.setThr(); }
    }).catch(() => {});
    LS.emit("online", on);
    showLink();
  }
  // frames from b: returns the bytes used
  function parse(b) {
    let o = 0;
    while (b.length - o >= 16) {
      if (b[o] !== 76 || b[o + 1] !== 83) { o++; continue; }  // lost the frame edge: find "LS" again
      const n = b[o + 4] | b[o + 5] << 8 | b[o + 6] << 16 | b[o + 7] << 24;
      if (b.length - o < 16 + n) break;
      frame(b.subarray(o, o + 16 + n));
      o += 16 + n;
    }
    return o;
  }
  function frame(f) {
    const v = new DataView(f.buffer, f.byteOffset, f.length), type = String.fromCharCode(f[2]), flags = f[3], n = v.getUint32(4, true);
    const index = v.getUint32(8, true) + v.getUint32(12, true) * 4294967296, p = f.subarray(16);
    if (type === "L") {
      const L = LS.live;
      if (L.end !== null && index > L.end) for (let k = Math.min((index - L.end) / LIVE | 0, LR); k > 0; k--) L.put(255, 0);  // lost pairs: gaps
      for (let i = 0; i + 1 < n; i += 2) L.put(p[i], p[i + 1]);
      L.end = index + (n >> 1) * LIVE; pairsGot += n >> 1;
      LS.emit("live");
    } else if (type === "W") {
      const trig = v.getUint32(16, true), d = p.subarray(8), per = flags || 1, m = per === 1 ? d.length : d.length >> 1;
      let lo = per === 1 ? d.slice() : new Uint8Array(m), hi = per === 1 ? lo : new Uint8Array(m);
      for (let i = 0; per > 1 && i < m; i++) { lo[i] = d[2 * i]; hi[i] = d[2 * i + 1]; }
      LS.emit("wave", { index, trig: trig === NONE ? null : trig, win: v.getUint32(20, true), per, lo, hi, n: m });
    } else if (type === "S") {
      LS.rate = v.getUint32(16, true);
      LS.status = { index, rate: LS.rate, lo: p[4], hi: p[5], base: p[6], thr: p[7], events: v.getUint32(24, true), lost: v.getUint32(28, true) };
      hist.push({ t: performance.now(), index, lost: LS.status.lost, pairs: pairsGot });
      if (hist.length > 11) hist.shift();
      showLink();
      LS.emit("status", LS.status);
    } else if (type === "E") {
      if (flags & 1) cur = { index, t: new Date(), parts: [], next: index, len: 0, broken: false };
      if (!cur) return;
      if (index !== cur.next || (flags & 4 && !(flags & 1))) cur.broken = true;  // a hole inside: not decodable
      cur.parts.push(p.slice()); cur.next = index + n; cur.len += n;
      if (flags & 2) {
        if (cur.broken) LS.broken++;
        else {
          const s = new Uint8Array(cur.len);
          let o = 0; for (const x of cur.parts) { s.set(x, o); o += x.length; }
          LS.emit("event", { no: ++LS.received, index: cur.index, t: cur.t, s });
        }
        cur = null;
      }
    }
  }
  // Link quality over the last 10 s of status frames: the live pairs that arrived of those the
  // board made in that time, times the samples the board did not have to drop; and the board's
  // own sample rate.
  function showLink(text) {
    const el = document.getElementById("app-link");
    let cls = "bad";
    if (!text && !LS.online) text = "connecting…", cls = "";
    else if (!text && hist.length < 3) text = "measuring link…", cls = "";
    else if (!text) {
      const a = hist[0], b = hist[hist.length - 1], samples = b.index - a.index;
      const q = Math.min(1, (b.pairs - a.pairs) / (samples / LIVE)) * (1 - Math.min(1, (b.lost - a.lost) / samples)) * 100, sps = samples / ((b.t - a.t) / 1000);
      cls = q >= 99 ? "good" : q >= 95 ? "fair" : "bad";
      text = `link ${q >= 99.95 ? "100" : q.toFixed(1)} % · ${(sps / 1e3).toFixed(0)} kS/s (${+(sps / 1e6).toFixed(2)} MHz)`;
    }
    el.className = "app-pill " + cls; el.textContent = text;
  }
  setInterval(() => { if (LS.online && hist.length && performance.now() - hist[hist.length - 1].t > 2500) showLink("link stalled"); }, 500);

  // MARK: the header: tabs, link, line, Calibrate, full screen, author

  const ext = (href, html, cls = "btn", title = "") => `<a class="${cls}" href="${href}" target="_blank" rel="noopener" title="${title}">${html}</a>`;
  const GHICON = '<svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.49c-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>';

      ui.btn("⚖ Calibrate", "cal", { id: "app-cal", title: "Probe calibration: two known points, any gain and offset" }) + ui.btn("⛶", "fs", { cls: "icon", title: "Full screen (F11)" }) +
      ext(SPONSOR, "♥", "btn icon app-heart", "Sponsor on GitHub") + `<button class="app-by" data-act="about" title="About loop-scope"><span class="avatar">HY</span><span>HamzaYslmn</span></button>`;

  // MARK: About: author, source, sponsor
  function about() {
    let d = document.getElementById("app-about");
    if (!d) {
      d = Object.assign(document.createElement("dialog"), { id: "app-about", className: "about" });
      d.innerHTML = `<form method="dialog"><button class="btn icon about-x" aria-label="Close">✕</button>

        <div class="cal-grid"><span></span><span class="muted">pin reads</span><span class="muted">real value</span><span></span>${pt(0)}${pt(1)}<b>Unit</b><input id="cal-unit" maxlength="4"></div>
        <div class="cal-quick"><span class="muted">Quick ratio:</span><input id="cal-qa" type="number" step="any" placeholder="15"> <span class="muted">real =</span> <input id="cal-qb" type="number" step="any" placeholder="3.3"> <span class="muted">pin, through 0</span> ${ui.btn("Apply", "quick", { id: "cal-q", type: "button" })}</div>

      </form>`;
      document.body.append(d);

      const read = () => ({ points: [[+f("cal-r0").value, +f("cal-a0").value], [+f("cal-r1").value, +f("cal-a1").value]], unit: f("cal-unit").value.trim() || "V" });

        const c = read(), [[r0, a0], [r1, a1]] = c.points;
        f("cal-ok").disabled = r0 === r1;
        if (r0 === r1) return void (f("cal-out").textContent = "the two pin readings must differ");
        const g = (a1 - a0) / (r1 - r0), o = a0 - g * r0, lo = g * LS.pinVolts(0) + o, hi = g * LS.pinVolts(255) + o;

  // MARK: demo: made-up frames through the same parser, for working without the board
  // ?demo: an idle line with a burst of 200/400 µs pulses every ~1.2 s. ?demo=square: 1 kHz, 30 %.
  const demo = (() => {
    let t0 = 0, sent = 0, sc = [2000, 1000, 100, 1, 0], thr = 8, pre = 2048, post = 4096, lastW = 0, lastS = 0, events = 0;
    const square = LS.demo === "square", noisy = LS.demo === "noise", PER = noisy ? 400_000 : 1_200_000;
    const burstAt = k => k * PER + 300_000;   // sample index of burst k
    const made = new Map();
    const bits = k => {   // an odd count: the burst ends high, so its last width has an edge after it

      const k = Math.floor((now - sent) / LIVE);

        const f = head("L", LIVE, 2 * k, sent);

      info: { reset: "power on", uptime_s: 0, cal: [...LS.pinTable(LINE)].map((v, c) => Math.round(v + 90 * Math.sin(Math.PI * c / 255))) },   // bent like a real ADC
      start() { t0 = performance.now() - 2000; online(true); setInterval(tick, 20); },
      command(q) {

  })();
})();

  // MARK: AUTO-RANGE: the same fit every 0.5 s, changing only what is clearly off

  // MARK: drawing

  }

      for (let k = 1; k < 10; k++) { g.moveTo(px(k * dw), 0); g.lineTo(px(k * dw), H); }

      $("grid").addEventListener("input", e => { st.grid = e.target.value / 100; LS.save("live", st); mark(); });
      $("pick").addEventListener("change", e => {
        const on = new Set(st.meas);
        e.target.checked ? on.add(e.target.dataset.mk) : on.delete(e.target.dataset.mk);
        st.meas = MEAS.map(m => m[0]).filter(x => on.has(x));
        LS.save("live", st); buildMeas();
      });
      canvas.addEventListener("pointerdown", e => {
        const p = pt(e), h = e.button === 0 && hit(p.x, p.y);
        if (!h) return;
        drag = h; e.preventDefault();
        canvas.setPointerCapture(e.pointerId);
        if (h === "level" || h === "pos" || h === "gnd") user();
        dragTo(p);
      });
      canvas.addEventListener("pointermove", e => {
        const p = pt(e);
        if (drag) return dragTo(p);
        hover = e.pointerType === "mouse" ? p : null;
        canvas.style.cursor = CURSOR[hit(p.x, p.y)] || "crosshair";
        mark();
      });
      const up = () => {
        if (!drag) return;
        if (drag === "pos" || drag === "gnd") clearPersist();
        drag = null; apply();
      };
      canvas.addEventListener("pointerup", up);
      canvas.addEventListener("pointercancel", up);
      canvas.addEventListener("pointerleave", () => { hover = null; mark(); });
      canvas.addEventListener("wheel", e => { const s = wheelStep(e); if (s) knob(e.shiftKey ? "vdiv" : "tdiv", s); }, { passive: false });
      new ResizeObserver(mark).observe($("wrap"));

      LS.on("wave", onWave);
      LS.on("live", onLive);
      LS.on("online", on => { lastQ = null; if (on) sendScope(); else if (force) endForce(true); sync(); mark(); });
      LS.on("status", sendScope);          // LS.rate may have moved the window size
      LS.on("calibration", () => { ver++; acMean = lastQ = null; measKey = ""; sendScope(); sync(); mark(); });
      setInterval(() => {
        if (!visible) return;
        badge();
        if (auto?.wait) autosetEnv();
        else if (auto && performance.now() - auto.t > 900) finishAuto("no capture came: kept the last fit");
        if (++tickN % 2 === 0) autoRangeTick();
        measTick();
        if (levelUntil && performance.now() > levelUntil) { levelUntil = 0; mark(); }
      }, 250);
      buildMeas();
      sync();
    },
    show() { visible = true; lastQ = null; sendScope(); sync(); mark(); },
    hide() {
      visible = false; hover = drag = auto = null;
      if (force) endForce(true);
      clearTimeout(sendT); sendT = 0;
      const win = winSamples();
      LS.scope(win, st.pos * win, levelCode(), codeEdge(), 0);   // no windows while nobody looks
      lastQ = null;
    },
    key(e) {
      if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest?.("input, select, textarea")) return;
      const f = KEYS[e.key] ?? KEYS[e.key.toLowerCase()];
      if (f) { e.preventDefault(); f(e); }
    },
  });
})();

// MARK: - Events
// The Events view. Every event the board finds (a burst on the loop, LS.on("event")) is read once on
// arrival: edges, pulse widths, the unit (the shortest common width) and a signature (each pulse as
// its level and its width in units). Identical messages share a signature and so a group. The list
// is virtual (thousands of rows); the canvases draw only when something changed. Events keep
// arriving while the view is hidden.
//
// Download writes .jsonl, an event a line, oldest first:
//   {"start":"2026-10-07T01:26:27.719","index":9000000,"rate":1000000,"scale":4.545,"offset":0,
//    "cal":[142,3098],"codes":"<base64>"}
// start: local time the event arrived; index: the board's sample index of its first sample;
// codes: the raw samples, one byte each (the ADC's top 8 bits). Volts of a code c: pin mV / 1000 *
// scale + offset, the pin mV being cal[c] when cal has 256 values (the board's own table), else
// the line cal[0] + (c*16+8) * (cal[1]-cal[0]) / 4095.
// Import reads such files back, marked imported, each event with its file's own calibration.
(function () {
  "use strict";
  const { clamp, ui, C } = LS, fmt = LS.fmt, K = ui.kbd;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
  const RH = 26;                 // list row height, px (.ev-row)
  const MIN = 8;                 // narrowest plot view, samples
  const LIST = 1, DETAIL = 2, PLOT = 4, OVER = 8, HIST = 16, STATS = 32, ALL = 63;
  const MODES = { off: "Off", pw: "Pulse width", pd: "Pulse distance", man: "Manchester", nrz: "NRZ" };

  // MARK: settings kept in the browser
  const UI = LS.load("events-ui", { minEdges: 2, minSwing: 0, keep: 1000, memMB: 256, follow: true, sort: "seq", dir: -1, left: 480, bottom: 240, tab: "pulses", hist: "event", mode: "events", hideNoise: false });
  UI.dec = Object.assign({ mode: "pw", lv: "both", bit: 0, skip: 0, msb: true, inv: false }, UI.dec);
  const saveUI = () => LS.save("events-ui", UI);
  const CAP = LS.load("capture", { thr: LS.THR, pre_ms: 2.048, post_ms: 4.096 });  // the stream sets capture.thr on connect
  const saveCap = () => LS.save("capture", CAP);
  const names = LS.load("event-groups", {});       // group names by signature

  // MARK: state
  const events = [];             // kept, oldest first
  const picked = new Set();      // multi-selection
  const groups = [], byKey = new Map(), arrivals = [], bySeq = new Map();
  const cur = { A: null, B: null };                // cursors: seconds from the event's first edge
  let shown = [];                // filtered and sorted: what the list shows
  let seq = 0, impNo = 0, bytes = 0, skipped = 0, gid = 0, lastLive = null;
  let sel = null, anchor = null, ref = null, gFilter = null, starOnly = false, query = [];
  let armed = true, on = false, root = null;
  let view = null, yz = 1, hover = null, placing = null, hiPulse = -1, hiBit = -1, calVer = 0;
  let dirty = 0, raf = 0, ovCache = { key: "", c: null }, revealing = false;

  function need(f) { dirty |= f; if (!raf) raf = requestAnimationFrame(frame); }
  function frame() {
    raf = 0;
    if (!on) return;             // the flags wait for show()
    const f = dirty; dirty = 0;
    if (revealing) { revealing = false; reveal(sel); }   // here, once a frame: it reads the layout
    if (f & LIST) UI.mode === "groups" ? drawGroups() : drawList();
    if (f & STATS) stats();
    if (f & DETAIL) detail();
    if (f & OVER) drawOver();
    if (f & PLOT) { drawPlot(); cursorBox(); }
    if (f & HIST) drawHist();
  }

  // MARK: reading an event, once
  const lvl = (ev, k) => ev.dec.first ^ ((k + 1) & 1);   // level of pulse k (after edge k): 1 high
  const vt = ev => ev.vt || LS.VT;
  const vAt = (ev, c) => { const T = vt(ev), i = clamp(Math.floor(c), 0, 255), j = Math.min(255, i + 1); return T[i] + (T[j] - T[i]) * (c - i); };
  const swing = ev => Math.abs(vt(ev)[ev.dec.hi] - vt(ev)[ev.dec.lo]);
  const us = (ev, samples) => samples * 1e6 / ev.rate;
  const fmtUs = x => fmt.t(x / 1e6);
  const fmtSigned = t => (t < 0 ? "−" : "+") + fmt.t(Math.abs(t));
  const hex2 = v => v.toString(16).toUpperCase().padStart(2, "0");
  const plotS = ev => ({ n: ev.s.length, lo: ev.s, hi: ev.s, T: vt(ev) });

  // The unit: the shortest width that recurs (a cluster holding 8 % of the pulses, at least 2).
  function unitOf(w) {
    if (!w.length) return 0;
    const cl = LS.clusters(w, Infinity), n = Math.max(2, Math.ceil(w.length * 0.08));
    const u = cl.reduce((u, c) => c.n >= n && c.w < u ? c.w : u, Infinity);
    return u < Infinity ? u : cl.reduce((u, c) => Math.min(u, c.w), Infinity);
  }
  function analyse(ev) {
    const D = LS.decode(ev.s), e = D.edges, n = e.length, w = new Float32Array(Math.max(0, n - 1));
    for (let k = 0; k + 1 < n; k++) w[k] = e[k + 1] - e[k];
    ev.dec = D; ev.n = n; ev.w = w; ev.e0 = n ? e[0] : 0; ev.act = n > 1 ? e[n - 1] - e[0] : 0;
    ev.unit = unitOf(w);
    // noise?: most pulses are not whole multiples (1..8, ±15 %) of the unit, as a message's are
    let fit = 0;
    for (const x of w) { const q = x / ev.unit, r = Math.round(q); if (r >= 1 && r <= 8 && Math.abs(q - r) <= 0.15) fit++; }
    ev.noisy = w.length >= 4 && fit < 0.7 * w.length;
    // the signature: "H1L1H2…", each pulse's level and width in units; and a sparkline of it
    let key = "", path = "", U = 0;
    if (w.length) {
      const Y = l => (l ? 1.5 : 8.5);
      path = `M0 ${Y(1 - lvl(ev, 0))}h1`; U = 1;
      for (let k = 0; k < w.length; k++) {
        const q = Math.max(1, Math.round(w[k] / ev.unit)), l = lvl(ev, k);
        key += (l ? "H" : "L") + q;
        if (U < 300) { const h = Math.min(q, 12); path += `V${Y(l)}h${h}`; U += h; }
      }
      path += `V${Y(1 - lvl(ev, w.length - 1))}h1`; U += 1;
    } else key = n + (n === 1 ? " edge" : " edges");
    ev.key = key; ev.path = path; ev.U = U;
  }
  // A group: the same signature at a unit within 25 %.
  function assign(ev) {
    let list = byKey.get(ev.key);
    if (!list) byKey.set(ev.key, list = []);
    let g = list.find(g => !g.unit || Math.abs(ev.unit - g.unit) <= 0.25 * g.unit);
    if (!g) {
      g = { id: ++gid, key: ev.key, unit: ev.unit, rate: ev.rate, n: 0, kept: 0, last: ev.t, pulses: ev.w.length, path: ev.path, U: ev.U };
      list.push(g); groups.push(g);
    }
    g.unit += (ev.unit - g.unit) / (g.n + 1); g.n++; g.kept++;
    if (ev.t > g.last) g.last = ev.t;
    ev.g = g;
  }
  const gcol = g => `hsl(${Math.round((g.id * 137.508) % 360)} 72% 66%)`;
  const gtag = g => `<span class="ev-g" style="--g:${gcol(g)}">G${g.id}</span>${names[g.key] ? ` <span class="ev-gn">${esc(names[g.key])}</span>` : ""}`;
  const spark = (path, U) => path ? `<svg class="ev-spark" style="width:${Math.min(U * 3, 600)}px" viewBox="0 0 ${U} 10" preserveAspectRatio="none"><path vector-effect="non-scaling-stroke" d="${path}"/></svg>` : `<span class="dim">—</span>`;

  function make(s, t, index, rate, label, prev, extra) {
    const ev = Object.assign({ seq: ++seq, label, s, t, index, rate, star: false, note: "", imp: null, vt: null, gone: false }, extra);
    analyse(ev);
    ev.dt = prev && prev.rate === rate ? (index + ev.e0 - prev.index - prev.e0) / rate : null;
    ev.cont = !!prev && index === prev.index + prev.s.length;    // the board cut a long one: this continues it
    assign(ev);
    events.push(ev); bySeq.set(ev.seq, ev); bytes += s.length;
    return ev;
  }

  // MARK: the collection
  function onEvent(x) {
    arrivals.push(performance.now());
    if (!armed) { skipped++; lastLive = null; return need(STATS); }
    const ev = lastLive = make(x.s, x.t, x.index, LS.rate, String(x.no), lastLive), vis = passes(ev), L = $("ev-list");
    if (vis) {
      const at = insertShown(ev);
      if (!UI.follow && L.scrollTop > 0 && at * RH <= L.scrollTop) L.scrollTop += RH;   // keep the rows in view still
    }
    trim();
    if (vis && (UI.follow || !sel) && !ev.gone) pick(ev);
    badge(); need(LIST | STATS | (UI.hist === "all" ? HIST : 0));
  }
  // Keep and Mem: the oldest unstarred go first.
  function trim() {
    while (events.length > UI.keep || (bytes > UI.memMB * 1048576 && events.length > 1)) {
      const ev = events.splice(Math.max(0, events.findIndex(e => !e.star)), 1)[0];
      bytes -= ev.s.length; ev.g.kept--; ev.gone = true; bySeq.delete(ev.seq);
      picked.delete(ev);
      const j = shown.indexOf(ev);
      if (j >= 0) shown.splice(j, 1);
      if (anchor === ev) anchor = null;
    }
  }
  const badge = () => LS.setBadge("events", events.length || "");
  const hiddenBy = ev => ev.n < UI.minEdges || (UI.minSwing > 0 && swing(ev) < UI.minSwing) || (UI.hideNoise && ev.noisy);
  const textOf = ev => `#${ev.label} ${fmt.clock(ev.t)} ${ev.note} g${ev.g.id} ${names[ev.g.key] || ""} ${ev.key} ${ev.imp ? "imported " + ev.imp.name : ""} ${ev.star ? "starred" : ""}`.toLowerCase();
  function passes(ev) {
    if (hiddenBy(ev) || (gFilter && ev.g !== gFilter) || (starOnly && !ev.star)) return false;
    const t = query.length && " " + textOf(ev) + " ";
    // "#3" or "g3" means that event or group, not every number starting with 3
    return query.every(q => /^(#|g)\d+$/.test(q) ? t.includes(" " + q + " ") : t.includes(q));
  }
  const SORT = { star: e => +e.star, seq: e => e.seq, t: e => +e.t, dt: e => e.dt ?? -Infinity, act: e => e.act / e.rate, n: e => e.n, sw: swing, sig: e => e.g.id };
  function cmp(a, b) { const f = SORT[UI.sort] || SORT.seq, x = f(a), y = f(b); return (x < y ? -1 : x > y ? 1 : a.seq - b.seq) * UI.dir; }
  function insertShown(ev) {

  }

  }
  function setFollow(v) { UI.follow = v; $("ev-follow").classList.toggle("on", v); saveUI(); }
  function setArmed(v) {

    $("ev-arm").classList.toggle("paused", !v);

    need(STATS);
  }
  const selection = () => picked.size > 1 && picked.has(sel) ? [...picked] : sel ? [sel] : [];
  function toggleStar(list) {

    const v = !list[0].star;

    need(LIST | DETAIL);
  }
  function setRef(ev) {
    if (ref && ref !== sel) ref.bc = ref.bk = null;
    ref = ev;
    if (ev) LS.toast(`Reference: #${ev.label}`);

  }
  function setGroupFilter(g) {

    ["act", "Active", "r", "First edge to last edge"], ["n", "Edges", "r"], ["sw", "Swing", "r ev-c-sw", "Highest minus lowest level"], ["sig", "Signature", "", "The group (identical messages share it) and the pulse pattern in units"]];
  function head() {
    $("ev-head").innerHTML = COLS.map(([k, l, c, t]) => `<span data-k="${k}" class="${c}${UI.sort === k ? " on" : ""}" title="${t || ""}">${l}${k === "sw" ? " " + LS.unit() : ""}${UI.sort === k ? (UI.dir < 0 ? " ▾" : " ▴") : ""}</span>`).join("");
  }

      `<span class="ev-st${ev.star ? " on" : ""}" data-star title="Star">★</span>` +
      `<span class="ev-no" title="${ev.imp ? "imported from " + esc(ev.imp.name) : ""}">${ev.cont ? "↪" : ""}${esc(ev.label)}</span>` +
      `<span class="ev-t ev-c-time">${fmt.clock(ev.t)}</span><span class="r">${fmt.t(ev.dt)}</span><span class="r">${ev.n > 1 ? fmt.t(ev.act / ev.rate) : "—"}</span>` +
      `<span class="r">${ev.n}</span><span class="r ev-c-sw">${swing(ev).toFixed(1)}</span>` +
      `<span class="ev-sig" style="--g:${gcol(ev.g)}"><span class="ev-g">G${ev.g.id}</span>${ev.noisy ? '<span class="ev-nz">noise?</span>' : ""}${ev.note ? `<span class="ev-note" title="${esc(ev.note)}">${esc(ev.note)}</span>` : spark(ev.path, ev.U)}</span></div>`;
  }

    $("ev-spacer").style.height = shown.length * RH + "px";

  }
  function drawGroups() {
    $("ev-gbody").innerHTML = groups.slice().sort((a, b) => b.n - a.n).slice(0, 1000).map(g => `<div class="ev-gcols ev-grow${g === gFilter ? " sel" : ""}" data-g="${g.id}" style="--g:${gcol(g)}" title="${esc(g.key.length > 300 ? g.key.slice(0, 300) + "…" : g.key)}">` +
      `<span class="ev-g">G${g.id}</span><span class="ev-gname">${names[g.key] ? `<b>${esc(names[g.key])}</b>` : ""}${spark(g.path, g.U)}</span>` +
      `<span class="r">${g.n}</span><span class="r">${g.kept}</span><span class="r">${g.unit ? fmtUs(us(g, g.unit)) : "—"}</span><span class="r">${g.pulses}</span>` +

      `<span title="Whole events the stream brought since the page opened"><b>${LS.received}</b> received</span>`,
      `<span title="Listed with the current filters (${events.length} kept)"><b>${shown.length}</b> shown</span>`,
      hidden && `<span title="Under the Hide limits">${hidden} hidden</span>`,
      `<span class="${LS.broken ? "bad" : ""}" title="Events dropped for a hole inside (the link lost samples)"><b>${LS.broken}</b> broken</span>`,

    g.stroke();
    g.textAlign = "center"; g.textBaseline = "middle"; g.font = `11px ${C.mono}`;
    for (let k = Math.max(1, k0); k < n && e[k - 1] <= b; k++) {
      const xa = X(e[k - 1]), xb = X(e[k]), px = xb - xa, wu = us(ev, e[k] - e[k - 1]);
      if (px < 30) continue;

      g.fillText((wu >= 100 ? wu.toFixed(0) : wu.toFixed(1)) + (px >= 72 ? " µs" : ""), (Math.max(xa, G.L) + Math.min(xb, G.L + G.w)) / 2, (yH + yL) / 2 + .5);

  }

  function drawOver() {
    const { g, W, H, d } = LS.canvas($("ev-ov"));

    const ev = sel, N = ev.s.length, key = `${ev.seq}|${W}|${H}|${d}|${calVer}`;

    g.fillStyle = C.accent; g.fillRect(xa - 1, H / 2 - 9, 3, 18); g.fillRect(xb - 2, H / 2 - 9, 3, 18);
  }

  function drawHist() {
    if (UI.tab !== "hist") return;
    const { g, W, H } = LS.canvas($("ev-hist"));
    g.fillStyle = C.screen; g.fillRect(0, 0, W, H);
    if (W < 80 || H < 60) return;
    const src = UI.hist === "all" ? shown : sel ? [sel] : [], hs = [], ls = [], CAPN = 200000;
    let total = 0, evs = 0;
    for (const ev of src) {
      if (total >= CAPN) break;
      evs++;
      for (let k = 0; k < ev.w.length && total < CAPN; k++, total++) (lvl(ev, k) ? hs : ls).push(us(ev, ev.w[k]));
    }
    $("ev-hinfo").textContent = total ? `${total} pulses from ${evs} event${evs === 1 ? "" : "s"}${total >= CAPN ? " (first " + CAPN + ")" : ""}` : "";
    g.font = `11px ${C.mono}`;
    if (!total) { g.fillStyle = C.faint; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(src.length ? "No complete pulses" : "No event", W / 2, H / 2); return; }
    const all = hs.concat(ls).sort((x, y) => x - y), max = (all[Math.min(all.length - 1, Math.floor(all.length * 0.995))] || 1) * 1.12;
    const G = { L: 46, T: 26, w: W - 60, B: H - 24 }, h = G.B - G.T, nb = clamp(Math.floor(G.w / 5), 10, 240), bw = max / nb, pw = G.w / nb;
    const ch = new Uint32Array(nb), cl = new Uint32Array(nb);
    let beyond = 0, top = 1;
    for (const x of hs) x < max ? ch[Math.floor(x / bw)]++ : beyond++;
    for (const x of ls) x < max ? cl[Math.floor(x / bw)]++ : beyond++;
    for (let i = 0; i < nb; i++) top = Math.max(top, ch[i], cl[i]);
    const X = v => G.L + v / max * G.w, Y = c => G.B - c / top * h;
    axes(g, G, [0, max, LS.nice(max / Math.max(2, G.w / 90)), X, fmtUs], [0, top, Math.max(1, LS.nice(top / Math.max(2, h / 34))), Y, String]);
    // bars: H then L, side by side in each bin
    for (let i = 0; i < nb; i++) {
      const x = G.L + i * pw;
      if (ch[i]) { g.fillStyle = C.trace; g.fillRect(x + .5, Y(ch[i]), Math.max(1, pw / 2 - .5), G.B - Y(ch[i])); }
      if (cl[i]) { g.fillStyle = C.trace2; g.fillRect(x + pw / 2, Y(cl[i]), Math.max(1, pw / 2 - .5), G.B - Y(cl[i])); }
    }

    g.textAlign = "center"; g.textBaseline = "top";

      g.strokeStyle = "rgba(199,146,234,.6)"; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(x, G.T); g.lineTo(x, G.B); g.stroke(); g.setLineDash([]);

  // MARK: the plot's hover and cursors
  function hoverTag() {
    const tag = $("ev-hover"), G = plotGeo();
    tag.hidden = !hover || !sel || !view || hover.x < G.L || hover.x > G.L + G.w;
    if (tag.hidden) return;
    const ev = sel, i = sampleAt(hover.x, G), e = ev.dec.edges, k = lowerBound(e, i);
    let t = `t ${fmtSigned((i - ev.e0) / ev.rate)} · ${fmt.v(vt(ev)[ev.s[clamp(Math.round(i), 0, ev.s.length - 1)]])}`;
    if (k > 0 && k < e.length) t += ` · ${lvl(ev, k - 1) ? "H" : "L"} pulse ${k}: ${fmtUs(us(ev, ev.w[k - 1]))}` + (ev.unit ? ` = ${Math.max(1, Math.round(ev.w[k - 1] / ev.unit))}u` : "");
    if (UI.dec.mode !== "off") { const B = bitsOf(ev), j = bitAt(B.bits, i); if (j >= 0) t += ` · bit ${j} = ${B.bits[j].v} (byte ${j >> 3})`; }
    tag.textContent = t;
  }
  function cursorBox() {
    const box = $("ev-curs"), ev = sel;
    for (const id of ["A", "B"]) { const b = $("ev-c" + id.toLowerCase()); b.classList.toggle("set", cur[id] !== null); b.classList.toggle("on", placing === id); }
    $("ev-plot").parentElement.classList.toggle("placing", !!placing);
    box.hidden = !ev || (cur.A === null && cur.B === null);
    if (box.hidden) return;
    const val = id => vt(ev)[ev.s[clamp(Math.round(curS(ev, id)), 0, ev.s.length - 1)]];
    let h = "";
    for (const id of ["A", "B"]) if (cur[id] !== null) h += `<i>${id}</i><span>${fmtSigned(cur[id])}</span><span>${fmt.v(val(id))}</span>`;
    if (cur.A !== null && cur.B !== null) {
      const dt = Math.abs(cur.B - cur.A);
      h += `<i class="d">Δ</i><span class="d">${fmt.t(dt)}</span><span class="d">${fmt.v(val("B") - val("A"))}</span>` +
        `<i class="d">1/Δ</i><span class="d">${fmt.f(1 / dt)}</span><span class="d">${dt ? fmtUs(dt * 1e6) : ""}</span>`;
    }

  }
  // A cursor at plot x, snapped to an edge within 7 px unless Alt is held.
  function setCursorAt(id, x, noSnap) {
    const G = plotGeo(), ev = sel, e = ev.dec.edges;
    let p = sampleAt(x, G), best = 7;
    if (!noSnap) for (const j of [lowerBound(e, p) - 1, lowerBound(e, p)]) if (j >= 0 && j < e.length && Math.abs(xOf(e[j], G) - x) <= best) { best = Math.abs(xOf(e[j], G) - x); p = e[j]; }
    cur[id] = (p - ev.e0) / ev.rate;
    need(PLOT);
  }
  function nearCursor(x) {
    if (!sel || !view) return null;

  }
  function cursorKey(id) {
    if (!sel) return;

    else { placing = placing === id ? null : id; need(PLOT); }
  }

  // MARK: view changes
  function setView(a, span) {
    if (!sel) return;
    const N = sel.s.length;
    span = clamp(span, Math.min(MIN, N), N); a = clamp(a, 0, N - span);
    view = [a, a + span]; need(PLOT | OVER);
  }
  function zoomBy(f, at) { if (!view) return; const [a, b] = view; at ??= (a + b) / 2; setView(at - (at - a) * f, (b - a) * f); }
  function zoomTo(sa, sb) { const span = Math.max((sb - sa) * 4, 40); setView((sa + sb) / 2 - span / 2, span); }
  const pan = f => view && setView(view[0] + (view[1] - view[0]) * f, view[1] - view[0]);
  function fitNow() { if (sel) { view = fit(sel); yz = 1; need(PLOT | OVER); } }

  // MARK: files
  const iso = t => new Date(t - t.getTimezoneOffset() * 6e4).toISOString().slice(0, 23);   // local time
  function b64(s) { let r = ""; for (let i = 0; i < s.length; i += 32768) r += String.fromCharCode.apply(null, s.subarray(i, i + 32768)); return btoa(r); }
  function download(list, what) {
    if (!list.length) return LS.toast(what === "sel" ? "Select events first (Ctrl/Shift-click, Ctrl+A)" : "No events to download");
    const parts = [...list].sort((a, b) => a.seq - b.seq).map(ev => JSON.stringify({
      start: ev.imp ? ev.imp.start : iso(ev.t), index: ev.index, rate: ev.rate,
      scale: ev.imp ? ev.imp.scale : LS.gain(), offset: ev.imp ? ev.imp.offset : LS.offset(), cal: ev.imp ? ev.imp.cal : LS.CAL,
      codes: b64(ev.s),
    }) + "\n");
    LS.download(`loop-events-${LS.stamp()}.jsonl`, new Blob(parts, { type: "application/x-ndjson" }));
    LS.toast(`Downloaded ${parts.length} event${parts.length === 1 ? "" : "s"}`);
  }
  // An imported event keeps its file's calibration: its own code -> volts table.
  function table(o) {
    const g = typeof o.scale === "number" ? o.scale : LS.gain(), off = typeof o.offset === "number" ? o.offset : 0;
    return LS.pinTable(o.cal?.length === 2 || o.cal?.length === 256 ? o.cal.map(Number) : LS.CAL).map(mv => mv / 1000 * g + off);
  }
  async function importFiles(files) {
    let n = 0, bad = 0, last = null;
    const before = events.length;
    for (const file of files) {
      let prev = null;
      for (const l of (await file.text().catch(() => (bad++, ""))).split("\n")) {
        if (!l.trim()) continue;
        try {
          const o = JSON.parse(l), s = Uint8Array.from(atob(o.codes), c => c.charCodeAt(0)), t = new Date(o.start);
          if (!s.length) throw 0;
          prev = last = make(s, isNaN(t) ? new Date() : t, +o.index || 0, +o.rate > 0 ? +o.rate : 1e6, "i" + ++impNo, prev,
            { imp: { name: file.name, start: o.start, scale: o.scale, offset: o.offset, cal: o.cal }, vt: table(o) });
          n++;
        } catch { bad++; }
      }
    }
    trim(); rebuild(); badge();
    const lost = before + n - events.length;
    if (last && !last.gone) { setFollow(false); pick(last); }
    LS.toast(`Imported ${n} event${n === 1 ? "" : "s"}` + (bad ? ` · ${bad} unreadable line${bad === 1 ? "" : "s"}` : "") + (lost > 0 ? ` · ${lost} older dropped (Keep / Mem)` : ""));
  }
  function samplesCSV() {
    const ev = sel, T = vt(ev);
    LS.download(`loop-event-${ev.label}-${LS.stamp()}.csv`, "time_s,volts\n" + Array.from(ev.s, (c, i) => (i / ev.rate).toFixed(7) + "," + T[c].toFixed(4)).join("\n") + "\n", "text/csv");
  }

  }
  // The page is served over plain http by the board: no async clipboard there, so the old way too.
  function copy(text, what) {
    const done = () => LS.toast(`Copied ${what}`);

      const t = Object.assign(document.createElement("textarea"), { value: text });
      t.style.cssText = "position:fixed;left:-9999px;opacity:0";

  // MARK: the board's capture settings

    const r = LS.rate;
