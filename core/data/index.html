  function setThr(v) { CAP.thr = v; $("ev-thr").value = v; saveCap(); LS.setThr(v); }
  // The line's noise from the live envelope's last 2 s: the swing of each 256-sample block (the
  // board judges blocks that long), its 90th percentile so traffic does not count; 1.5x that + 1 code.
  function autoThr() {
    const { lo, hi, n } = LS.live.last(Math.round(2 * (LS.rate) / LS.LIVE)), r = [];
    for (let i = 0; i + 4 <= n; i += 4) {
      let a = 255, b = 0;
      for (let j = i; j < i + 4; j++) if (lo[j] <= hi[j]) { if (lo[j] < a) a = lo[j]; if (hi[j] > b) b = hi[j]; }
      if (a <= b) r.push(b - a);
    }
    if (r.length < 8) return LS.toast("No live data yet: Auto reads the last 2 s of the line");
    const noise = r.sort((x, y) => x - y)[Math.floor(r.length * 0.9)], q = Math.abs(LS.perCode()), v = +Math.max(0.3, (noise * 1.5 + 1) * q).toFixed(2);

  }

      `<span class="ev-dl">${ui.popBtn("⤓ Download ▾", "ev-dlmenu", { id: "ev-dlb", title: "Save events to one .jsonl file" })}<span id="ev-dlmenu" class="pop menu" hidden>` +
      [["all", "All kept", "Every kept event, to one .jsonl file"], ["shown", "Shown", "The events the filters show"], ["sel", "Selected", "The selected events (Ctrl/Shift-click, Ctrl+A)"]]
        .map(([w, l, t]) => `<button id="ev-dl-${w}" data-act="dl" data-w="${w}" title="${t}">${l} <i></i></button>`).join("") + `</span></span><span class="grow"></span>` +
      B("Clear", "clear", { id: "ev-clear", cls: "danger", title: "Forget every kept event" }) + B("?", "help", { id: "ev-helpb", cls: "icon", title: "Keyboard shortcuts (?)" });
    $("ev-ibar").innerHTML = B("☆", "star", { id: "ev-star", cls: "icon", title: "Star / unstar (S): starred events are kept longest" }) +
      B("⇄ Ref", "pin", { id: "ev-pin", title: "Pin as the reference that others are compared with (R)" }) +
      ["A", "B"].map(c => B(c, "cur", { id: "ev-c" + c.toLowerCase(), cls: "ev-cur", "data-c": c, title: `Cursor ${c}: click here, then in the plot (or press ${c} over the plot)` })).join("") +
      B("⤢ Fit", "fit", { title: "Fit to the talk: first to last edge (F or double-click)" }) + B("CSV", "csv", { title: "This event's samples as CSV (time_s, volts)" }) +
      `<input id="ev-note" type="text" maxlength="300" placeholder="Note for this event…  (N)" autocomplete="off">`;
    $("ev-tabs").outerHTML = ui.seg("tab", [["pulses", "Pulses"], ["hist", "Histogram"], ["decode", 'Decode <code id="ev-dout" class="ev-dout"></code>', "Decode settings, bits and bytes"], ["compare", "Compare"]], { id: "ev-tabs" });
    $("ev-ph-pulses").innerHTML = `<div id="ev-chips" class="ev-chips"></div><span class="grow"></span>` + B("Copy pulses", "copyp", { id: "ev-copyp", title: "All pulses as CSV: n, level, width_us, start_us" });
    $("ev-sc-pulses").innerHTML = ui.table("ev-ptb", ["#", "level", "width µs", "units", "start µs", "bits"]) + '<div id="ev-pmore" class="ev-hint"></div>';
    $("ev-ph-hist").innerHTML = ui.seg("hist", [["event", "This event"], ["all", "All shown"]], { id: "ev-hsrc" }) + '<span id="ev-hinfo" class="dim"></span>';
    $("ev-ph-decode").innerHTML = `<select id="ev-dmode" title="How pulses become bits (D cycles)">${Object.entries(MODES).map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select>` +
      `<select id="ev-dlv" title="Which pulses carry bits: Pulse width reads these; Pulse distance times these marks' starts"><option value="both">H + L</option><option value="H">H pulses</option><option value="L">L pulses</option></select>` +
      `<label class="ev-fld"><span id="ev-dbitl">split</span><input id="ev-dbit" type="number" step="any" min="0" placeholder="auto"><i>µs</i></label>` +
      ui.num("ev-dskip", "skip", "", { step: 1, min: 0, title: "Pulses to skip first (a preamble), or for Manchester the edge to sync on" }) +
      ui.seg("dord", [["msb", "MSB", "First bit is the byte's top bit"], ["lsb", "LSB", "First bit is the byte's bottom bit"]], { id: "ev-dord" }) +
      B("Invert", "dinv", { id: "ev-dinv", title: "Swap 0 and 1 (Manchester: G. E. Thomas instead of IEEE)" }) + `<span class="grow"></span>` +
      B("Copy bits", "copyb") + B("Copy hex", "copyh", { title: "Copy the bytes as hex" });
    $("ev-sc-decode").innerHTML = '<div id="ev-dsum" class="ev-dsum"></div><div id="ev-bits" class="ev-bits"></div>' + ui.table("ev-btb", ["byte", "hex", "binary", "dec", "chr", "start µs", "from pulses"]);
    $("ev-ph-compare").innerHTML = '<span id="ev-cref"></span><span class="grow"></span>' + B("⇄ Pin selected", "cpin", { id: "ev-cpin", title: "Pin the selected event as the reference (R)" }) + B("Clear", "cclr", { id: "ev-cclr", title: "Clear the reference (X)" });
    const dt = (...k) => K(...k);
    ui.help("ev-help", "Events · shortcuts", [
      ["List", [[dt("↑", "↓"), "previous / next event (Shift: extend)"], [dt("Home", "End"), "first / last"], [`${K("Ctrl")}/${K("Shift")}+click`, "select more"], [dt("Ctrl", "A"), "select all shown"],
        [dt("S"), "star"], [dt("N"), "note"], [dt("G"), "events / groups"], [dt("/"), "search"], [dt("Space"), "arm / pause"], [dt("Esc"), "clear group filter, close"]]],
      ["Plot", [["wheel, " + dt("+", "−"), "zoom time"], ["drag, " + dt("←", "→"), "pan"], [K("Shift") + "+wheel", "zoom volts"], [K("F") + ", double-click", "fit to the talk"],
        [dt("A", "B"), "cursor at the mouse (Alt: no snap)"], [dt("C"), "clear cursors"], [dt("R", "X"), "pin / clear reference"], [dt("D"), "next decoding"], ["click lanes", "find the pulse / bit in the tables"], [dt("?"), "this help"]]],
    ], "Drop .jsonl files on the list to import them. Starred events are dropped last when Keep or Mem is reached.");
    // numbers: shown from the settings, applied on change
    const num = (id, get, set) => { const el = $(id); el.value = get(); el.addEventListener("change", () => { const v = parseFloat(el.value); if (isFinite(v)) set(v); el.value = get(); }); };
    const kept = () => { saveUI(); trim(); badge(); need(LIST | STATS); };
    num("ev-thr", () => CAP.thr, v => setThr(+Math.max(0.01, v).toFixed(3)));
    num("ev-pre", () => +CAP.pre_ms.toFixed(3), v => { CAP.pre_ms = clamp(v, 0, 32768 / (LS.rate) * 1000); saveCap(); sendWindow(); });
    num("ev-post", () => +CAP.post_ms.toFixed(3), v => { CAP.post_ms = clamp(v, 0.256 * maxMs() / 1000, maxMs()); saveCap(); sendWindow(); });
    num("ev-keep", () => UI.keep, v => { UI.keep = clamp(Math.round(v), 10, 100000); kept(); });
    num("ev-mem", () => UI.memMB, v => { UI.memMB = clamp(Math.round(v), 16, 4096); kept(); });
    num("ev-minedges", () => UI.minEdges, v => { UI.minEdges = clamp(Math.round(v), 0, 1e6); saveUI(); rebuild(); });
    num("ev-minswing", () => UI.minSwing, v => { UI.minSwing = Math.max(0, v); saveUI(); rebuild(); });
  }

  // MARK: wiring
  function act(a, el) {
    const fn = {
      arm: () => setArmed(!armed), auto: autoThr, import: () => $("ev-file").click(), clear: clearAll, help: () => $("ev-help").showModal(),
      staronly: () => { starOnly = !starOnly; el.classList.toggle("on", starOnly); rebuild(); },
      hidenoise: () => { UI.hideNoise = !UI.hideNoise; el.classList.toggle("on", UI.hideNoise); saveUI(); rebuild(); },
      follow: () => { setFollow(!UI.follow); if (UI.follow && shown.length) pick(shown.reduce((x, y) => y.seq > x.seq ? y : x)); },
      unfilter: () => setGroupFilter(null),
      dl: () => { ui.close(); download({ all: events, shown, sel: picked.size ? [...picked] : sel ? [sel] : [] }[el.dataset.w], el.dataset.w); },
      star: () => toggleStar(selection()), pin: () => sel && setRef(ref === sel ? null : sel),
      cur: () => { placing = placing === el.dataset.c ? null : el.dataset.c; need(PLOT); }, curclear: () => { cur.A = cur.B = null; need(PLOT); },
      fit: fitNow, csv: samplesCSV, copyp: pulsesCSV, copyb: () => copyDecoded(false), copyh: () => copyDecoded(true),
      dinv: () => { UI.dec.inv = !UI.dec.inv; decoded(); },
      cpin: () => sel && setRef(sel), cclr: () => setRef(null),
    }[a];
    fn?.();
  }
  const decoded = () => { saveUI(); need(DETAIL | PLOT); hoverTag(); };
  function seg(name, v) {
    if (name === "mode") setMode(v);
    else if (name === "tab") setTab(v);
    else if (name === "hist") { UI.hist = v; saveUI(); ui.segOn($("ev-hsrc"), v); need(HIST); }
    else if (name === "dord") { UI.dec.msb = v === "msb"; decoded(); }
  }
  function wire() {
    ui.wire(root, { act, seg });
    $("ev-search").addEventListener("input", e => { query = e.target.value.toLowerCase().split(/\s+/).filter(Boolean); rebuild(); });
    $("ev-head").addEventListener("click", e => {
      const k = e.target.closest("[data-k]")?.dataset.k;
      if (!k) return;
      if (UI.sort === k) UI.dir = -UI.dir; else { UI.sort = k; UI.dir = -1; }
      saveUI(); head(); rebuild(); requestAnimationFrame(() => reveal(sel));
    });
    $("ev-list").addEventListener("scroll", () => need(LIST), { passive: true });
    $("ev-rows").addEventListener("click", e => {
      const ev = bySeq.get(+e.target.closest(".ev-row")?.dataset.s);
      if (ev) e.target.closest("[data-star]") ? toggleStar([ev]) : clickRow(ev, e);
    });
    $("ev-gbody").addEventListener("click", e => {
      const g = groups[+e.target.closest("[data-g]")?.dataset.g - 1];
      if (!g) return;
      if (!e.target.closest("[data-ren]")) return setGroupFilter(g === gFilter ? null : g);
      const v = prompt(`Name for group G${g.id} (empty: none)`, names[g.key] || "");
      if (v === null) return;
      v.trim() ? names[g.key] = v.trim() : delete names[g.key];
      LS.save("event-groups", names); need(LIST | DETAIL);
    });
    $("ev-file").addEventListener("change", e => { const f = [...e.target.files]; e.target.value = ""; if (f.length) importFiles(f); });
    const side = $("ev-side"), drop = $("ev-drop");
    side.addEventListener("dragover", e => { if (!e.dataTransfer.types.includes("Files")) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; drop.hidden = false; });
    side.addEventListener("dragleave", e => { if (!side.contains(e.relatedTarget)) drop.hidden = true; });
    side.addEventListener("drop", e => { e.preventDefault(); drop.hidden = true; const f = [...e.dataTransfer.files]; if (f.length) importFiles(f); });
    const note = $("ev-note");
    note.addEventListener("input", () => { if (sel) { sel.note = note.value; need(LIST); } });
    note.addEventListener("change", () => { if (query.length) rebuild(); });
    note.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === "Escape") note.blur(); });
    // decode settings
    $("ev-dmode").onchange = e => { UI.dec.mode = e.target.value; decoded(); };
    $("ev-dlv").onchange = e => { UI.dec.lv = e.target.value; decoded(); };
    $("ev-dbit").addEventListener("change", e => { const v = parseFloat(e.target.value); UI.dec.bit = v > 0 ? v : 0; decoded(); });
    $("ev-dskip").addEventListener("change", e => { UI.dec.skip = Math.max(0, parseInt(e.target.value) || 0); decoded(); });
    // tables and lanes: a click finds the pulse, bit or byte in the plot
    $("ev-ptb").addEventListener("click", e => {
      const k = +e.target.closest("tr")?.dataset.k;
      if (sel && k >= 0) { hiPulse = k; markRow("ev-ptb", k); zoomTo(sel.dec.edges[k], sel.dec.edges[k + 1]); }
    });
    $("ev-bits").addEventListener("click", e => {
      const i = +e.target.closest("[data-b]")?.dataset.b, t = sel && bitsOf(sel).bits[i];
      if (t) { hiBit = i; markBit(i); zoomTo(t.a, t.b); }
    });
    $("ev-btb").addEventListener("click", e => {
      const j = +e.target.closest("tr")?.dataset.y, B = sel && bitsOf(sel), by = B?.bytes[j];
      if (by) { hiBit = by.i; markBit(by.i); zoomTo(B.bits[by.i].a, B.bits[by.i + 7].b); }
    });
    $("ev-cbody").addEventListener("click", e => {
      const k = +e.target.closest("tr")?.dataset.k;
      if (sel && k >= 0 && k < sel.w.length) { hiPulse = k; zoomTo(sel.dec.edges[k], sel.dec.edges[k + 1]); }
    });
    plotPointer(); overPointer(); splitters();
  }

  function plotPointer() {
    const c = $("ev-plot");
    let drag = null;
    c.addEventListener("pointerdown", e => {
      if (!sel || !view || e.button > 0) return;
      c.setPointerCapture(e.pointerId);
      if (placing) { drag = { m: "cur", id: placing }; placing = null; return setCursorAt(drag.id, e.offsetX, e.altKey); }
      const id = nearCursor(e.offsetX);
      drag = id ? { m: "cur", id } : { m: "pan", x0: e.clientX, v: view.slice(), moved: false };
    });
    c.addEventListener("pointermove", e => {
      hover = { x: e.offsetX, y: e.offsetY };
      if (drag?.m === "cur") setCursorAt(drag.id, e.offsetX, e.altKey);
      else if (drag) {
        const dx = e.clientX - drag.x0, [a, b] = drag.v;
        if (Math.abs(dx) > 3) drag.moved = true;
        if (drag.moved) { setView(a - dx / plotGeo().w * (b - a), b - a); c.style.cursor = "grabbing"; }
      } else c.style.cursor = nearCursor(e.offsetX) ? "ew-resize" : "";
      hoverTag(); need(PLOT);
    });
    const end = e => {
      if (drag?.m === "pan" && !drag.moved && e.type === "pointerup") clickPlot(e.offsetX, e.offsetY);
      drag = null; c.style.cursor = "";
    };
    c.addEventListener("pointerup", end);
    c.addEventListener("pointercancel", end);
    c.addEventListener("pointerleave", () => { if (!drag) { hover = null; hoverTag(); need(PLOT); } });
    c.addEventListener("dblclick", fitNow);
    c.addEventListener("wheel", e => {
      if (!sel || !view) return;
      e.preventDefault();
      const G = plotGeo(), [a, b] = view, u = e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1, dy = e.deltaY * u, dx = e.deltaX * u;
      if (e.shiftKey) { yz = clamp(yz * Math.exp(-(dy || dx) * 0.002), 0.2, 200); need(PLOT); }
      else if (Math.abs(dx) > Math.abs(dy)) setView(a + dx / G.w * (b - a), b - a);
      else zoomBy(Math.exp(dy * 0.0015), clamp(sampleAt(e.offsetX, G), a, b));
    }, { passive: false });
  }
  // A click (no drag) in the levels lane picks that pulse, in the decode lane that bit.
  function clickPlot(x, y) {
    const G = plotGeo(), i = sampleAt(x, G);
    hiPulse = hiBit = -1;
    if (y >= G.yLv - 3 && y <= G.yLv + G.LV + 2) {
      const k = lowerBound(sel.dec.edges, i);
      if (k > 0 && k < sel.dec.edges.length) hiPulse = k - 1;
      if (hiPulse >= 0 && UI.tab !== "pulses") setTab("pulses"); else markRow("ev-ptb", hiPulse);
    } else if (G.DC && y >= G.yDc - 2 && y <= G.yDc + G.DC) {
      hiBit = bitAt(bitsOf(sel).bits, i);
      if (hiBit >= 0 && UI.tab !== "decode") setTab("decode"); else markBit(hiBit);
    } else markRow("ev-ptb", -1);
    need(PLOT);
  }
  function overPointer() {
    const c = $("ev-ov"), span = () => view[1] - view[0];
    let drag = null;
    const where = x => { const W = c.clientWidth, N = sel.s.length, xa = view[0] / N * W, xb = view[1] / N * W, edges = xb - xa > 14; return { W, N, xa, xb, l: edges && Math.abs(x - xa) <= 6, r: edges && Math.abs(x - xb) <= 6, in: x > xa && x < xb }; };
    c.addEventListener("pointerdown", e => {
      if (!sel || !view) return;
      c.setPointerCapture(e.pointerId);
      const w = where(e.offsetX);
      if (w.l || w.r) drag = { m: w.l ? "l" : "r" };
      else if (w.in) drag = { m: "move", off: (e.offsetX - w.xa) / w.W * w.N };
      else { setView(e.offsetX / w.W * w.N - span() / 2, span()); drag = { m: "move", off: span() / 2 }; }
    });
    c.addEventListener("pointermove", e => {
      if (!sel || !view) return;
      const w = where(e.offsetX), p = clamp(e.offsetX / w.W * w.N, 0, w.N);
      if (!drag) c.style.cursor = w.l || w.r ? "ew-resize" : w.in ? "grab" : "pointer";
      else if (drag.m === "l") { const a = Math.min(p, view[1] - MIN); setView(a, view[1] - a); }
      else if (drag.m === "r") setView(view[0], Math.max(p, view[0] + MIN) - view[0]);
      else setView(p - drag.off, span());
    });
    c.addEventListener("pointerup", () => { drag = null; });
    c.addEventListener("pointercancel", () => { drag = null; });
    c.addEventListener("wheel", e => { if (!sel || !view) return; e.preventDefault(); zoomBy(Math.exp(e.deltaY * (e.deltaMode ? 33 : 1) * 0.0015), clamp(e.offsetX / c.clientWidth * sel.s.length, view[0], view[1])); }, { passive: false });
  }
  function splitters() {
    const drag = (el, move) => el.addEventListener("pointerdown", e => {
      e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add("drag");
      const up = () => { el.classList.remove("drag"); el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); saveUI(); };
      el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
    });
    drag($("ev-split"), e => {
      const r = root.getBoundingClientRect();
      UI.left = Math.round(clamp(e.clientX - r.left, 300, Math.max(300, r.width - 420)));
      root.style.setProperty("--ev-left", UI.left + "px"); need(LIST | PLOT | OVER | HIST);
    });
    drag($("ev-hsplit"), e => {
      const r = $("ev-main").getBoundingClientRect();
      UI.bottom = Math.round(clamp(r.bottom - e.clientY, 110, Math.max(110, r.height - 280)));
      $("ev-main").style.setProperty("--ev-bottom", UI.bottom + "px"); need(PLOT | OVER | HIST);
    });
  }

  const KEYS = {
    ArrowDown: e => step(1, e.shiftKey), ArrowUp: e => step(-1, e.shiftKey),
    PageDown: e => step(Math.max(1, Math.floor($("ev-list").clientHeight / RH) - 1), e.shiftKey),
    PageUp: e => step(-Math.max(1, Math.floor($("ev-list").clientHeight / RH) - 1), e.shiftKey),
    Home: e => step(-shown.length, e.shiftKey), End: e => step(shown.length, e.shiftKey),
    ArrowLeft: () => pan(-0.2), ArrowRight: () => pan(0.2),
    "+": () => zoomBy(0.6), "=": () => zoomBy(0.6), "-": () => zoomBy(1 / 0.6), "_": () => zoomBy(1 / 0.6),
    " ": e => { if (e.target.tagName === "BUTTON") e.target.blur(); setArmed(!armed); },
    f: fitNow, s: () => toggleStar(selection()), n: () => sel && $("ev-note").focus(),
    r: () => sel && setRef(sel), x: () => ref && setRef(null), a: () => cursorKey("A"), b: () => cursorKey("B"),
    c: () => { cur.A = cur.B = placing = null; need(PLOT); },
    g: () => setMode(UI.mode === "events" ? "groups" : "events"),
    d: () => { const m = Object.keys(MODES); UI.dec.mode = m[(m.indexOf(UI.dec.mode) + 1) % m.length]; decoded(); LS.toast("Decode: " + MODES[UI.dec.mode]); },
    "/": () => $("ev-search").focus(), "?": () => $("ev-help").showModal(),
  };

  // MARK: the view
  LS.view("events", {
    init(el) {
      root = el;
      root.style.setProperty("--ev-left", UI.left + "px");
      $("ev-main").style.setProperty("--ev-bottom", UI.bottom + "px");
      if (!["pulses", "hist", "decode", "compare"].includes(UI.tab)) UI.tab = "pulses";
      build(); wire();
      $("ev-hidenoise").classList.toggle("on", UI.hideNoise);
      setFollow(UI.follow); setArmed(true); setMode(UI.mode === "groups" ? "groups" : "events"); setTab(UI.tab);
      ui.segOn($("ev-hsrc"), UI.hist);
      const units = () => { for (const u of root.querySelectorAll(".ev-unit")) u.textContent = LS.unit(); head(); };
      units();
      LS.on("event", onEvent);
      LS.on("status", () => need(STATS));
      LS.on("online", up => { if (up) sendWindow(); });
      LS.on("calibration", () => { calVer++; units(); if (UI.minSwing > 0 || UI.sort === "sw") rebuild(); need(ALL); });
      new ResizeObserver(() => need(LIST | PLOT | OVER | HIST)).observe(root);
      setInterval(() => { if (on) need(STATS); }, 1000);
      badge(); need(ALL);
    },
    show() { on = revealing = true; need(ALL); },
    hide() { on = false; hover = null; $("ev-hover").hidden = true; },
    key(e) {
      const t = e.target, k = e.key, field = t.closest?.("input, textarea, select");
      if (k === "Escape") {
        if (placing) { placing = null; need(PLOT); }
        else if (field) t.blur();
        else if (gFilter) setGroupFilter(null);
        return;
      }
      if (field) return;
      if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === "a") { e.preventDefault(); picked.clear(); for (const ev of shown) picked.add(ev); return need(LIST | STATS | DETAIL); }
      const f = !e.ctrlKey && !e.metaKey && !e.altKey && KEYS[k.length === 1 ? k.toLowerCase() : k];
      if (f) { e.preventDefault(); f(e); }
    },
  });
})();

LS.start();
</script>
</body>
</html>
