# Pins the toolchain, so a bare `arduino-cli compile core` builds the same image on every
# bench: a profile ignores whatever is installed globally.
profiles:
  devkit:
    notes: Classic ESP32 (WROOM-32 DevKit, CP210x bridge), 4 MB flash, default partitions.
    fqbn: esp32:esp32:esp32:FlashSize=4M,PartitionScheme=default,UploadSpeed=921600
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json

default_profile: devkit
